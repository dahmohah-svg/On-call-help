<title>On-Call Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky shift bar + tabbed workspace (Board / Timeline / Tasks / Team). Task colours follow the ISO anaesthetic syringe-label convention. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #e8edeb;
  --fg: #16201d;
  --muted: #5b6a65;
  --line: #d3dbd8;
  --accent: #1d6b58;
  --accent-fg: #ffffff;
  --warn: #b25e00;
  --crit: #c62828;
  --ok: #2e7d32;
  /* syringe-label colours */
  --c-ot: #7b3fa3;       /* violet – vasopressors */
  --c-em: #e0262f;       /* fluorescent red – NMB */
  --c-aps: #1f6fc7;      /* blue – opioids */
  --c-pre: #d8a800;      /* yellow – induction agents */
  --c-list: #858b92;     /* grey – local anaesthetics */
  --c-obs: #d9654a;      /* salmon – antiemetics */
  --c-code: #0b93ad;     /* cyan – code blue team */
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #172120; --surface-2: #1f2b29; --fg: #e4ece9; --muted: #93a49e; --line: #2c3a37;
    --accent: #4fc0a0; --accent-fg: #06201a; --warn: #f0a24a; --crit: #ff6b6b; --ok: #6cc070;
    --c-ot: #b98ae0; --c-em: #ff5a5f; --c-aps: #6fb0ff; --c-pre: #f2cd3c; --c-list: #a6acb3; --c-obs: #ff9b80; --c-code: #45d0e8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #172120; --surface-2: #1f2b29; --fg: #e4ece9; --muted: #93a49e; --line: #2c3a37;
  --accent: #4fc0a0; --accent-fg: #06201a; --warn: #f0a24a; --crit: #ff6b6b; --ok: #6cc070;
  --c-ot: #b98ae0; --c-em: #ff5a5f; --c-aps: #6fb0ff; --c-pre: #f2cd3c; --c-list: #a6acb3; --c-obs: #ff9b80; --c-code: #45d0e8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1280px; margin: 0 auto; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* header */
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--f-mono); font-weight: 400; font-size: 12px; color: var(--muted); text-transform: none; letter-spacing: 0; }
.bar-stats { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.stat { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.stat b { color: var(--fg); font-family: var(--f-mono); }
.stat.alert { background: color-mix(in srgb, var(--crit) 15%, transparent); color: var(--crit); }
.stat.alert b { color: var(--crit); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 8px 14px 9px; font-family: var(--f-display); font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

main { padding-block: 16px 64px; display: grid; gap: 16px; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spacer { flex: 1; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 7px 12px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--crit); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn .dot, .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }

.t-ot { --c: var(--c-ot); } .t-em { --c: var(--c-em); } .t-aps { --c: var(--c-aps); } .t-pre { --c: var(--c-pre); } .t-list { --c: var(--c-list); } .t-obs { --c: var(--c-obs); } .t-code { --c: var(--c-code); }
.dot { background: var(--c); }

.banner { border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 14px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }

/* board */
.queue { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.queue.has { border-color: color-mix(in srgb, var(--crit) 50%, var(--line)); }
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.doc.off { opacity: .55; }
.doc-h { display: flex; gap: 8px; align-items: flex-start; }
.doc-name { font-weight: 700; font-size: 17px; line-height: 1.2; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.chip.tier2 { background: color-mix(in srgb, var(--c-ot) 16%, transparent); color: var(--c-ot); }
.chip.tier1 { background: color-mix(in srgb, var(--c-aps) 16%, transparent); color: var(--c-aps); }
.chip.coord { background: var(--accent); color: var(--accent-fg); }
.chip.obs { background: color-mix(in srgb, var(--c-obs) 18%, transparent); color: var(--c-obs); }
.chip.lp { background: color-mix(in srgb, var(--c-list) 22%, transparent); color: var(--fg); }
select.status { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 3px 6px; font-size: 13px; margin-left: auto; }
.load { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: flex; }
.load span { display: block; height: 100%; background: var(--c); }
.load-l { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.empty { color: var(--muted); font-size: 13px; }

/* task item */
.tasks { display: grid; gap: 6px; }
.task { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 6px; overflow: hidden; padding-left: 10px; }
.task.help { border-color: var(--crit); border-left-color: var(--c); box-shadow: 0 0 0 2px var(--crit); }
.help-row { grid-column: 1 / -1; margin: 0 8px 8px 0; padding: 6px 8px; border-radius: 5px; background: color-mix(in srgb, var(--crit) 12%, transparent); color: var(--crit); font-weight: 700; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.st-btns { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 8px 8px 0; }
.st-btns button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 9px 4px; font-weight: 700; font-size: 13px; }
.st-btns button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.st-btns button.b-help { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 50%, var(--line)); }
.st-btns button.b-help[aria-pressed="true"] { background: var(--crit); color: #fff; border-color: var(--crit); }
.st-sel { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; font-size: 12px; font-weight: 700; padding: 2px 6px; max-width: 130px; }
.st-sel.active { background: var(--c); color: #fff; border-color: var(--c); }
.st-sel.done { color: var(--ok); }
.st-sel.help { background: var(--crit); color: #fff; border-color: var(--crit); }
.who { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; font-size: 12.5px; padding: 1px 4px; max-width: 210px; }
.helpq { border: 2px solid var(--crit); border-radius: var(--r); background: color-mix(in srgb, var(--crit) 7%, var(--surface)); padding: 12px; display: grid; gap: 8px; }
.helpq h2 { color: var(--crit); }
.me-btn { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.me-btn.unset { border-color: var(--accent); color: var(--accent); }
.who-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.who-list .btn { justify-content: center; }
.who-list .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.post-l { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.chip.tier3 { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.chip.post-ot { background: color-mix(in srgb, var(--c-ot) 13%, transparent); color: var(--c-ot); }
.chip.post-out { background: color-mix(in srgb, var(--c-aps) 13%, transparent); color: var(--c-aps); }
.shiftnav { display: flex; align-items: center; gap: 4px; flex: 1 1 280px; min-width: 0; }
.shiftnav button.nav { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 30px; height: 28px; font-weight: 700; }
.shiftnav .lbl { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding: 0 4px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shiftnav button { flex: none; }
.shiftnav .lbl b { color: var(--fg); font-family: var(--f-body); font-size: 13px; }
.chip.duty { background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); }
.duty-pick { display: flex; flex-wrap: wrap; gap: 4px; }
.duty-pick button { border: 1px solid var(--line); border-top: 3px solid var(--c); background: var(--surface-2); border-radius: 6px; padding: 4px 8px; font-size: 12.5px; font-weight: 700; }
.duty-pick button[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 20%, var(--surface)); border-color: var(--c); }
.chip.hol { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.rota-t td, .rota-t th { white-space: nowrap; }
.rota-t tr.cur td { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.team-card { border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: grid; gap: 8px; background: var(--bg); }
.plan-t td, .plan-t th { white-space: nowrap; }
.plan-t td.time { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.plan-t tr.now td { background: color-mix(in srgb, var(--accent) 12%, transparent); }
.nowbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, var(--surface)); font-size: 13.5px; }
.nowbar b.k { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .06em; font-size: 12px; color: var(--muted); font-weight: 600; }
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 12px; }
.room { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.room.running { border-left-color: var(--ok); }
.room.waiting { border-left-color: var(--warn); }
.room.done { border-left-color: var(--muted); }
.room-name { font-family: var(--f-display); font-weight: 700; font-size: 20px; letter-spacing: .03em; text-transform: uppercase; }
.zone { display: grid; gap: 8px; }
.zone-h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.zone-h .empty { font-size: 13px; }
.mtiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.mtile { text-align: left; font: inherit; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--line); border-radius: var(--r); padding: 8px 10px; display: grid; gap: 2px; align-content: start; min-width: 0; min-height: 96px; cursor: pointer; }
.mtile .mt-n { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: .02em; text-transform: uppercase; display: flex; justify-content: space-between; gap: 6px; }
.mtile .mt-n small { font-family: var(--f-mono); font-weight: 500; font-size: 12px; color: var(--muted); }
.mtile .mt-s { font-size: 12px; font-weight: 700; color: var(--muted); }
.mtile .mt-c { font-size: 13px; font-weight: 700; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.mtile .mt-a { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.mtile.running { border-top-color: var(--ok); background: color-mix(in srgb, var(--ok) 9%, var(--surface)); } .mtile.running .mt-s { color: var(--ok); }
.mtile.waiting { border-top-color: var(--warn); background: color-mix(in srgb, var(--warn) 9%, var(--surface)); } .mtile.waiting .mt-s { color: var(--warn); }
.mtile.done { border-top-color: var(--muted); opacity: .78; }
.mtile.empty { border-style: dashed; border-top-style: solid; opacity: .7; }
.mtile.help { border-color: var(--crit); border-top-color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, var(--surface)); opacity: 1; } .mtile.help .mt-s { color: var(--crit); }
.beds { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; }
.bed { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 10px 12px; display: grid; gap: 6px; }
.bed .bn { font-family: var(--f-display); font-weight: 700; font-size: 18px; text-transform: uppercase; letter-spacing: .03em; }
.bed .bv { display: flex; align-items: center; gap: 10px; }
.bed .bv b { font: 700 34px/1 var(--f-display); min-width: 42px; text-align: center; }
.bed .bv b.zero { color: var(--crit); }
.bed .bv button { width: 40px; height: 40px; font-size: 22px; font-weight: 700; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--fg); cursor: pointer; }
.rep { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.rep th, .rep td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.rep th { font-family: var(--f-display); font-weight: 600; letter-spacing: .05em; text-transform: uppercase; font-size: 13px; color: var(--muted); }
.rep td.n, .rep th.n { text-align: right; font-family: var(--f-mono); }
.kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.kpi { background: var(--surface-2); border-radius: var(--r); padding: 8px 10px; }
.kpi b { display: block; font: 700 28px/1.1 var(--f-display); } .kpi span { font-size: 12px; color: var(--muted); }
.alertbar { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); z-index: 60; width: min(560px, calc(100% - 24px)); background: var(--crit); color: #fff; border-radius: 12px; padding: 12px 14px; box-shadow: 0 10px 30px rgba(0,0,0,.35); display: flex; gap: 10px; align-items: center; font-weight: 700; }
.alertbar .spacer { flex: 1; } .alertbar button { background: #fff; color: var(--crit); border: 0; border-radius: 8px; padding: 6px 12px; font-weight: 700; cursor: pointer; }
.legend-m { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--muted); }
.legend-m i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
.rchip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; background: var(--surface-2); color: var(--muted); }
.rchip.running { background: color-mix(in srgb, var(--ok) 16%, transparent); color: var(--ok); }
.rchip.waiting { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.rchip.cancelled { text-decoration: line-through; }
.case-row { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
.case-row .t { font-weight: 700; overflow-wrap: anywhere; }
.case-row.done .t, .case-row.cancelled .t { color: var(--muted); }
.nora-case { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--line); border-radius: 6px; padding: 10px 12px; display: grid; gap: 6px; min-width: 0; }
.nora-case.going { border-left-color: var(--ok); } .nora-case.pending { border-left-color: var(--warn); }
.nora-case.done { border-left-color: var(--muted); opacity: .75; } .nora-case.cancelled { border-left-color: var(--crit); opacity: .8; }
.nora-case .p { font-weight: 700; overflow-wrap: anywhere; }
.prep { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin: 0; font-size: 14px; }
.prep dt { color: var(--muted); font-weight: 600; } .prep dd { margin: 0; overflow-wrap: anywhere; }
.prep-btn.has { color: var(--ok); font-weight: 700; }
.nora-st { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.nora-st button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 8px 4px; font-weight: 700; font-size: 13px; }
.nora-st button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.nora-st button.cx[aria-pressed="true"] { background: var(--crit); border-color: var(--crit); color: #fff; }
.reason { font-size: 13px; color: var(--crit); font-weight: 700; }
.log { font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; margin: 0; padding-left: 16px; }
details.done-list summary { cursor: pointer; font-weight: 700; color: var(--muted); font-size: 13px; padding: 4px 0; }
.task.done { opacity: .5; }
.task.done .t-title { text-decoration: line-through; }
.task.active { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.t-main { padding: 8px 0; min-width: 0; display: grid; gap: 2px; }
.t-top { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 12px; color: var(--muted); }
.t-type { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--c); font-size: 13px; }
.t-title { font-weight: 700; overflow-wrap: anywhere; }
.t-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.t-side { padding: 8px 8px 8px 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.pri { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; white-space: nowrap; border: 1px solid currentColor; }
.pri.p1 { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); }
.pri.p2 { color: var(--warn); }
.pri.p3 { color: var(--muted); }
.pri.p4 { color: var(--muted); border-style: dashed; }
.st { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; font-size: 12px; padding: 2px 9px; font-weight: 700; white-space: nowrap; }
.st.active { background: var(--c); color: #fff; border-color: var(--c); }
.st.done { color: var(--ok); }
.icon-btn { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 2px 4px; text-decoration: underline; }
.late { color: var(--crit); font-weight: 700; }

/* timeline */
.tl-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; }
.tl { position: relative; min-width: max-content; }
.tl-row { display: flex; border-bottom: 1px solid var(--line); min-height: 52px; }
.tl-row:last-child { border-bottom: 0; }
.tl-lab { position: sticky; left: 0; z-index: 2; width: 132px; flex: none; background: var(--surface); border-right: 1px solid var(--line); padding: 6px 10px; font-size: 13px; display: flex; flex-direction: column; justify-content: center; }

/* ---------- rota, teams and shift dates ---------- */
function isoDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

function isHoliday(date, sh) {
  if (sh && sh.holiday != null) return !!sh.holiday;
  const wd = new Date(date + 'T12:00:00').getDay();
  return R.settings.weekend.includes(wd) || R.settings.holidays.includes(date);
}
function keyDate(k) { return String(k).slice(0, 10); }
function keySession(k) { return String(k).endsWith('@am') ? 'am' : 'main'; }
function sessionsOf(date) { return !isHoliday(date, R.shifts[date]) && R.settings.morning ? [date + '@am', date] : [date]; }
function stepKey(key, dir) {
  const date = keyDate(key), list = sessionsOf(date); const i = list.indexOf(key); const j = (i < 0 ? (dir > 0 ? list.length - 1 : 0) : i) + dir;
  if (j >= 0 && j < list.length) return list[j];
  const nl = sessionsOf(addDays(date, dir)); return dir > 0 ? nl[0] : nl[nl.length - 1];
}
function windowForKey(key) {
  if (keySession(key) === 'am') { let m = hm2abs(R.settings.morningEnd) - hm2abs(R.settings.morningStart); if (m <= 0) m += 1440; return { start: R.settings.morningStart, mins: m }; }
  return windowFor(keyDate(key), isHoliday(keyDate(key), R.shifts[keyDate(key)]));
}
function sessionName(sh) { return sh.session === 'am' ? 'Morning duties' : isHoliday(sh.date, sh) ? 'Holiday' : 'Night'; }
function windowFor(date, hol) {
  const st = R.settings;
  if (hol) return { start: st.holidayStart, mins: 1440 };

  return { start: st.weekdayStart, mins: m };
}
function startDT(date, start) { return new Date(date + 'T' + start.padStart(5, '0') + ':00'); }
function shiftEnds(key) { const sh = R.shifts[key]; const w = sh ? { start: sh.shift.start, mins: sh.shift.mins } : windowForKey(key); return startDT(keyDate(key), w.start).getTime() + w.mins * 60000; }
// the session running now (or the next one to start): last night's shift until it ends, then this morning, then tonight
function currentShiftDate() {
  const today = isoDate(new Date()); const y = addDays(today, -1);
  if (Date.now() < shiftEnds(y)) return y;
  for (const k of sessionsOf(today)) if (Date.now() < shiftEnds(k)) return k;
  return today;

function buildDoctors(teamId, session) {
  const tm = R.teams.find(t => t.id === teamId); if (!tm) return [];

function roBanner() {

function taskItem(t, opts = {}) {
  const ty = TYPES[t.type]; const d = doc(t.doctorId);
  const end = t.start != null ? t.start + t.duration : null;
  const late = end != null && end > shiftLen();
  const time = t.start != null ? `<span class="num ${late ? 'late' : ''}">${fmt(t.start)}–${fmt(end)}</span>` : `<span class="num">not before ${esc(t.earliest || S.shift.start)}</span>`;
  const meta = [
    time,
    opts.hideDoc ? '' : (canAssign() && t.status !== 'done') ? `<select class="who" data-act="assign" data-id="${t.id}" aria-label="Assign doctor">${assignOpts(t)}</select>`
      : d ? `<span>${esc(d.name)}</span>` : `<span class="late">Unassigned</span>`,
    t.location ? `<span>${esc(t.location)}</span>` : '',
    t.theatre ? `<span>${esc(t.theatre)}</span>` : '',
    t.asa ? `<span>ASA ${esc(t.asa)}</span>` : '',
    `<span class="num">${t.duration} min</span>`,
    t.postedBy ? `<span>Posted by ${esc(t.postedBy)}</span>` : '',
  ].filter(Boolean).join('');
  const side = canStatus(t) && !opts.big
    ? `<select class="st-sel ${t.status}" data-act="setstatus" data-id="${t.id}" aria-label="Status">${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${t.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`
    : `<span class="st ${t.status}">${ST[t.status]}</span>`;
  const helpRow = t.status === 'help' ? `<div class="help-row"><span>${esc(d ? d.name : 'Someone')} needs help${t.helpAt ? ' · ' + ago(t.helpAt) : ''}${t.helpBy ? ` · <span style="color:var(--ok)">${esc(t.helpBy)} is going</span>` : ''}</span>${canEdit() && !t.helpBy && t.doctorId !== ui.meId ? `<button class="btn sm danger" data-act="ihelp" data-id="${t.id}">I'll go</button>` : ''}</div>` : '';
  const btns = opts.big && canStatus(t) ? `<div class="st-btns">${Object.entries(ST).map(([k, v]) => `<button class="${k === 'help' ? 'b-help' : ''}" aria-pressed="${t.status === k}" data-act="setst" data-v="${k}" data-id="${t.id}">${v}</button>`).join('')}</div>` : '';
  return `<div class="task ${ty.cls} ${t.status}">
    <div class="t-main"><div class="t-top"><span class="t-type">${ty.short}</span><span class="pri p${t.priority}">${esc(PRI[t.type][t.priority])}</span></div>
      <div class="t-title">${esc(t.title || ty.label)}</div><div class="t-meta">${meta}</div>
      ${t.notes ? `<div class="t-meta">${esc(t.notes)}</div>` : ''}</div>
    <div class="t-side">${side}
      ${canEditTask(t) ? `<button class="icon-btn" data-act="edit" data-id="${t.id}">Edit</button>` : ''}</div>${helpRow}${btns}</div>`;
}

function viewBoard() {
  const s = stats();

    <span><b>List prep:</b> ${lp.length ? lp.map(d => esc(d.name) + ` (${d.tier === 'second' ? '2nd' : '1st'})`).join(', ') : '<span class="late">not set</span>'}</span></div>`;
  if (unassigned.length) {
    h += `<section class="queue has"><div class="row"><h2>Waiting for a doctor · ${unassigned.length}</h2><span class="spacer"></span>${canEdit() ? '<button class="btn sm primary" data-act="schedule">Auto-assign</button>' : ''}</div>

function docCard(d) {
  const mine = S.tasks.filter(t => t.doctorId === d.id).sort((a, b) => (a.status === 'done') - (b.status === 'done') || (a.start ?? 1e9) - (b.start ?? 1e9));
  const open = mine.filter(t => t.status !== 'done');
  const L = shiftLen();
  const byType = Object.keys(TYPES).map(k => [k, open.filter(t => t.type === k).reduce((a, t) => a + t.duration, 0)]).filter(x => x[1]);
  const total = byType.reduce((a, x) => a + x[1], 0);
  const bar = byType.map(([k, m]) => `<span class="${TYPES[k].cls}" style="width:${Math.min(100, m / L * 100 * 2.5)}%"></span>`).join('');
  const shown = open.slice(0, 4);
  return `<article class="doc ${d.status === 'off' ? 'off' : ''}">
    <div class="doc-h"><div style="min-width:0"><div class="doc-name">${esc(d.name)}</div>
      <div class="chips"><span class="chip ${d.tier === 'second' ? 'tier2' : 'tier1'}">${d.tier === 'second' ? '2nd on-call' : d.tier === 'trainee' ? 'Trainee' : '1st on-call'}</span>${dutyChips(d)}${S.session === 'am' || d.tier !== 'first' ? '' : postChip(d)}${d.coordinator ? '<span class="chip coord">Coordinator</span>' : ''}${d.listPrep ? '<span class="chip lp">List prep</span>' : ''}${d.ext ? `<span class="chip num">ext ${esc(d.ext)}</span>` : ''}</div></div>
      <select class="status" data-act="docstatus" data-id="${d.id}" aria-label="Status of ${esc(d.name)}" ${canAssign() || d.id === ui.meId ? '' : 'disabled'}>${Object.entries(DOC_STATUS).map(([k, v]) => `<option value="${k}" ${d.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    ${d.tier === 'first' && canAssign() ? dutyPicker(d) : ''}
    <div class="row" style="justify-content:space-between">${d.tier === 'first' && canAssign() && S.session !== 'am' ? postSelect(d) : '<span></span>'}${canAssign() ? `<button class="btn sm" data-act="swap" data-id="${d.id}">Swap</button>` : ''}</div>
    <div><div class="load">${bar}</div><div class="load-l"><span>${open.length} open task${open.length === 1 ? '' : 's'}</span><span class="num">${Math.floor(total / 60)} h ${total % 60} min booked</span></div></div>
    <div class="tasks">${shown.length ? shown.map(t => taskItem(t, { hideDoc: true })).join('') : '<p class="empty">Nothing assigned. Free for the next call.</p>'}
    ${open.length > shown.length ? `<p class="empty">+ ${open.length - shown.length} more in Schedule</p>` : ''}</div></article>`;
}

function viewTimeline() {
  const L = shiftLen(); const hw = 84; const W = L / 60 * hw;
  const px = m => m / 60 * hw;
  let h = addButtons();
  h += `<div class="legend">${Object.entries(TYPES).map(([k, v]) => `<span class="${v.cls}"><i class="dot"></i>${v.label}</span>`).join('')}<span>Colours follow anaesthetic syringe labels</span></div>`;
  const hours = Array.from({ length: Math.ceil(shiftLen() / 60) }, (_, i) => `<div class="tl-hour" style="left:${px(i * 60)}px">${fmt(i * 60)}</div>`).join('');
  const nr = nowRel(); const nowLine = nr < L ? `<div class="now" style="left:${px(nr)}px" title="Now"></div>` : '';
  const block = t => {
    const ty = TYPES[t.type]; const s = Math.max(0, t.start); const e = Math.min(L, t.start + t.duration);
    if (e <= 0 || s >= L) return '';
    return `<button class="blk ${ty.cls} ${t.status}" style="left:${px(s)}px;width:${Math.max(px(e - s) - 2, 18)}px" data-act="edit" data-id="${t.id}" title="${esc(t.title)} ${fmt(t.start)}–${fmt(t.start + t.duration)}"><b>${esc(t.title || ty.label)}</b><span>${fmt(t.start)} ${t.theatre ? esc(t.theatre) : ''}</span></button>`;
  };
  const rows = [];
  rows.push(`<div class="tl-row tl-head" style="min-height:40px"><div class="tl-lab">Doctor</div><div class="tl-track" style="width:${W}px">${hours}</div></div>`);
  for (const d of S.doctors.filter(x => x.tier !== 'third')) {
    const ts = S.tasks.filter(t => t.doctorId === d.id && t.start != null);
    rows.push(`<div class="tl-row"><div class="tl-lab"><b>${esc(d.name)}</b><span>${tierShort(d)}${d.obs ? ' · obs' : ''}${inOT(d) ? ' · in OT' : ''}${d.coordinator ? ' · coord' : ''}${d.listPrep ? ' · list' : ''}</span></div><div class="tl-track" style="width:${W}px">${ts.map(block).join('')}${nowLine}</div></div>`);
  }
  const ths = S.shift.theatres;
  if (ths.length) {
    rows.push(`<div class="tl-row tl-head" style="min-height:28px"><div class="tl-lab">Theatres</div><div class="tl-track" style="width:${W}px"></div></div>`);
    for (const th of ths) {
      const ts = S.tasks.filter(t => inTheatre(t) && t.theatre === th && t.start != null);
      rows.push(`<div class="tl-row"><div class="tl-lab"><b>${esc(th)}</b><span>${ts.filter(t => t.status !== 'done').length} case(s)</span></div><div class="tl-track" style="width:${W}px">${ts.map(block).join('')}${nowLine}</div></div>`);
    }
  }
  h += `<div class="tl-wrap"><div class="tl" style="--hw:${hw}px">${rows.join('')}</div></div>`;
  if (canEdit()) h += `<p class="empty">Tap a block to edit, change the doctor or fix a start time. Auto-schedule keeps fixed tasks and anything in progress or done where it is.</p>`;
  return h;
}

      `<button class="${c}" aria-pressed="${f === k}" data-act="filter" data-f="${k}">${c ? '<i class="dot"></i>' : ''}${l} <span class="num">${S.tasks.filter(t => (k === 'all' || t.type === k) && t.status !== 'done').length}</span></button>`).join('') +
    `</div><span class="spacer"></span><label class="row" style="gap:6px;font-size:13px"><input type="checkbox" id="showDone" data-act="showdone" ${ui.showDone ? 'checked' : ''}> Show done</label></div>`;

/* ---------- OT rooms: what is running in each room, and whether lists are finished ---------- */
const CASE_ST = { waiting: 'Waiting', running: 'Running', done: 'Finished', cancelled: 'Cancelled' };
function otDay(date, create) {
  R.ot = R.ot || {}; let d = R.ot[date];
  if (!d && create) d = R.ot[date] = { rooms: R.settings.theatres.map(n => ({ id: uid(), name: n, list: '', anaes: '', cases: [] })) };
  return d;
}
function dayRooms(date) { const d = otDay(date); return d ? d.rooms : R.settings.theatres.map(n => ({ id: 'v:' + n, name: n, list: '', anaes: '', cases: [] })); }
function realRoom(rid) { if (String(rid).startsWith('v:')) { const d = otDay(S.date, true); return d.rooms.find(x => x.name === rid.slice(2)); } const d = otDay(S.date); return d && d.rooms.find(x => x.id === rid); }
// anyone signed in on this phone can update rooms (consultants running lists are often not on the on-call shift)
function canOt() { if (!verified()) return false; const r = role(); return r === 'none' || (!!meStaff() && ui.meId !== 'observer'); }
function hhmm(iso) { return iso ? new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''; }
function minsSince(a, b) { return Math.max(0, Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 60000)); }
function durTxt(m) { return m >= 60 ? Math.floor(m / 60) + ' h ' + (m % 60) + ' min' : m + ' min'; }
/* ---------- prepared (preop) details per case ---------- */
// stored as [[key, value], ...]; typed as "Key: value" lines; never patient names or file numbers
const PREP_KEYS = ['ASA', 'Weight', 'Comorbidities', 'Medications', 'Airway', 'Allergies', 'Fasting', 'Labs', 'ECG / Echo', 'Blood', 'Consent', 'Plan', 'Notes'];
function prepLine(l) { const m = l.match(/^([^:]{1,30}):\s*(.*)$/); return m ? [m[1].trim(), m[2].trim()] : ['Notes', l.trim()]; }
function parsePrep(txt) { return txt.split(/\r?\n/).map(x => x.trim()).filter(Boolean).map(prepLine).filter(([k, v]) => k && v); }
function prepText(d) { return (d || []).map(([k, v]) => k + ': ' + v).join('\n'); }
function mergePrep(old, add) { const out = (old || []).map(x => x.slice()); add.forEach(([k, v]) => { const o = out.find(x => x[0].toLowerCase() === k.toLowerCase()); if (o) o[1] = v; else out.push([k, v]); }); return out; }
function prepHtml(d) { return `<dl class="prep">${(d || []).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>`; }
function prepBtn(kind, c, room) { const has = c.details && c.details.length; if (!has && !canOt()) return '';
  return `<button class="icon-btn prep-btn ${has ? 'has' : ''}" data-act="prep-open" data-kind="${kind}" data-room="${esc(room || '')}" data-case="${c.id}">${has ? 'Prepared ✓' : '+ Prep details'}</button>`; }
function prepCase(kind, rid, cid) {
  if (kind === 'nora') return (noraDay(S.date) || { cases: [] }).cases.find(x => x.id === cid);
  const room = realRoom(rid); return room && room.cases.find(x => x.id === cid);
}
function showPrep(kind, rid, cid, err) {
  const c = prepCase(kind, rid, cid); if (!c) return; const edit = canOt(); const d = c.details || [];
  const title = kind === 'nora' ? c.proc : c.title, loc = kind === 'nora' ? c.loc : c.location;

    }
    case 'setst': setTaskStatus(t, el.dataset.v); break;
    case 'ihelp': t.helpBy = myName() || 'Someone'; commit(); toast('The team can see you are going'); break;
    case 'new': newTask(el.dataset.type); break;
    case 'edit': ui.confirmDel = false; openTask(t); break;
    case 'close': case 'close-bg': draft = null; ui.confirmDel = false; $layer.innerHTML = ''; break;
    case 'ftype': readForm(); draft.type = el.dataset.type; draft.duration = draft._new ? TYPES[draft.type].dur : draft.duration; renderSheet(); break;
    case 'del': readForm(); ui.confirmDel = true; renderSheet(); break;
    case 'del-no': readForm(); ui.confirmDel = false; renderSheet(); break;
    case 'del-yes': S.tasks = S.tasks.filter(x => x.id !== draft.id); draft = null; ui.confirmDel = false; $layer.innerHTML = ''; autoSchedule(); commit(); toast('Task deleted'); break;
    case 'schedule': autoSchedule(); commit(); { const s = stats(); toast(s.unassigned ? `${s.unassigned} task(s) could not be placed` : 'Schedule updated'); } break;
    case 'handover': showText('Handover / team update', handoverText()); break;
    case 'otlist': showText('OT list', otListText()); break;
    case 'copy': {
      const pre = document.getElementById('htext'); const txt = pre.textContent;
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Text selected – copy it with your device'); };
      try { navigator.clipboard.writeText(txt).then(() => toast('Copied'), fallback); } catch (err) { fallback(); }
      break;
    }
    case 'filter': ui.filter = el.dataset.f; render(); break;
    case 'goteam': ui.tab = 'team'; writePref('tab', 'team'); render(); window.scrollTo(0, 0); break;
    case 'sync-create': createBoard(); break;
    case 'sync-join': joinBoard(document.getElementById('joinCode').value); break;
    case 'sync-leave': leaveBoard(); break;
    case 'copy-code': copyText(sync.code, null); break;
    case 'copy-link': copyText(shareLink(), document.getElementById('shareLink')); break;
    case 'up': case 'down': {
      const th = t.theatre || '';
      const cs = S.tasks.filter(x => theatreCase(x) && (x.theatre || '') === th).sort((p, q) => (p.start ?? 1e9) - (q.start ?? 1e9) || p.seq - q.seq);
      const i = cs.indexOf(t); const j = a === 'up' ? i - 1 : i + 1; if (j < 0 || j >= cs.length) break;
      const o = cs[j];
      // swap order; equalise priority so the swap holds under NCEPOD ordering only when categories match
      [t.seq, o.seq] = [o.seq, t.seq];
      if (t.seq === o.seq) { a === 'up' ? t.seq-- : t.seq++; }
      if (t.priority !== o.priority) toast('Different category – higher priority still goes first');
      for (const x of [t, o]) if (x.status === 'pending' && !x.fixStart) { x.start = null; }
      // keep both in this theatre while reordering
      for (const x of [t, o]) if (x.theatreAuto) x.theatreAuto = false;
      autoSchedule(); commit(); break;
    }
    case 'clear-example': R = starterRoot(); ui.meId = ''; writePref('meId', ''); ui.shiftDate = currentShiftDate();
      for (let k = -1; k < 28; k++) R.rota[addDays(keyDate(ui.shiftDate), k)] = 'team-a';
      pointShift(); ui.tab = 'team'; writePref('tab', 'team'); commit(); toast('Blank board – add your staff and teams'); break;
    case 'reset': ui.confirmReset = true; render(); break;
    case 'reset-no': ui.confirmReset = false; render(); break;
    case 'reset-yes': R = blankRoot(); ui.shiftDate = currentShiftDate(); pointShift(); ui.confirmReset = false; commit(); toast('All data deleted'); break;
  }
});

document.addEventListener('change', e => {
  const el = e.target; const a = el.dataset.act; if (!a) return;
  const d = el.dataset.id ? doc(el.dataset.id) : null;
  if (a === 'nora-team') {
    if (!canOt()) { render(); toast('Enter your PIN to update the NORA list'); return; }
    noraDay(S.date, true).team = el.value.trim(); commit(); return;
  }
  if (a === 'room-f') {
    if (!canOt()) { render(); toast('Enter your PIN to update OT rooms'); return; }
    ui.distOpen = true; const rm = realRoom(el.dataset.room); if (!rm) return; const v = el.value.trim();
    if (el.dataset.f === 'name') { if (!v) { render(); return; } const old = rm.name; rm.name = v; S.tasks.forEach(t => { if (t.theatre === old) t.theatre = v; }); } else rm[el.dataset.f] = v;
    commit(); return;
  }
  const manageCh = new Set(['set-morning', 'set-ms', 'set-me', 'rota-team', 'tm-coord', 'tm-lp', 'tm-duty', 'tm-third', 'set-ph', 'tm-add', 'tm-name', 'sf-name', 'sf-tier', 'sf-obs', 'sf-ext', 'set-ws', 'set-we', 'set-hs', 'set-th', 'set-wk']);
  if (manageCh.has(a)) { if (!canManage()) { render(); toast('Only second on-calls can change the rota and teams'); return; } }
  else if (!canEdit() && a !== 'showdone') { render(); toast(role() === 'offduty' ? 'You are not on this shift – view only' : 'Observer view – read-only'); return; }
  const tm = el.dataset.team ? R.teams.find(t => t.id === el.dataset.team) : null;
  const mem = tm && el.dataset.id ? tm.members.find(m => m.staffId === el.dataset.id) : null;
  const sf = el.dataset.id ? staffOf(el.dataset.id) : null;
  const futureShifts = () => Object.values(R.shifts).filter(x => x.date >= keyDate(currentShiftDate()));
  switch (a) {
    case 'duty': d.duty = el.value; d.obs = el.value === 'obs'; logChange(`${d.name}: ${el.value ? DUTY[el.value] : 'no duty'}`); autoSchedule(); commit(); toast(`${d.name}: ${el.value ? DUTY[el.value] : 'no duty'}`); break;
    case 'plan-cell': {
      if (!canAssign()) { render(); break; }
      const b = S.plan[el.dataset.g][Number(el.dataset.i)]; b[el.dataset.f] = el.value;
      logChange(`Coverage ${fmt(b.start)}–${fmt(b.end)}: ${el.dataset.g === 'sec' ? '2nd in OT' : el.dataset.f === 'phone' ? 'phone' : '1st in OT'} → ${(doc(el.value) || {}).name || 'nobody'}`);
      autoSchedule(); commit(); break;
    }
    case 'setstatus': setTaskStatus(S.tasks.find(x => x.id === el.dataset.id), el.value); break;
    case 'assign': {
      const t = S.tasks.find(x => x.id === el.dataset.id); if (!t) break;
      if (el.value) { t.doctorId = el.value; t.fixDoctor = true; } else { t.fixDoctor = false; t.fixStart = false; }
      if (t.status === 'pending' && !t.fixStart) t.start = null;
      autoSchedule(); commit(); const nd = doc(t.doctorId);
      toast(nd ? `${t.title || TYPES[t.type].short} → ${nd.name}${t.start != null ? ' at ' + fmt(t.start) : ''}` : 'Back to auto-assign'); break;
    }
    case 'post': {
      d.post = el.value === 'out' ? { where: 'out', theatre: '' } : { where: 'ot', theatre: el.value.slice(3) }; logChange(`${d.name} posted ${postLabel(d)}`);
      autoSchedule(); commit(); toast(`${d.name}: ${postLabel(d)}`); break;
    }
    case 'docstatus': d.status = el.value; logChange(`${d.name}: ${DOC_STATUS[d.status]}`); autoSchedule(); commit(); toast(`${d.name}: ${DOC_STATUS[d.status]} – schedule updated`); break;
    case 'showdone': ui.showDone = el.checked; render(); break;
    case 'rota-team': {
      const dt = el.dataset.date; if (el.value) R.rota[dt] = el.value; else delete R.rota[dt];
      [dt, dt + '@am'].forEach(kk => { const sh = R.shifts[kk]; if (sh) { const oldName = teamName(sh.teamId); const prevS = S; S = sh; applyTeamToShift(sh, el.value); logChange(`Team changed${oldName ? ' from ' + oldName : ''} to ${teamName(el.value) || 'none'}`); S = prevS; } });
      pointShift(); commit(); toast(`${dayLabel(dt)}: ${teamName(el.value) || 'no team'}`); break;
    }
    case 'tm-name': tm.name = el.value.trim() || tm.name; commit(); break;
    case 'tm-coord': tm.members.forEach(m => m.coordinator = m.staffId === el.dataset.id); commit(); break;
    case 'tm-lp': mem.listPrep = el.checked; commit(); break;
    case 'tm-duty': mem.duty = el.value; mem.obs = el.value === 'obs'; commit(); break;
    case 'tm-third': mem.thirdRole = el.value; commit(); break;
    case 'tm-add': if (el.value) { const x = staffOf(el.value); tm.members.push({ staffId: x.id, coordinator: false, listPrep: false, obs: !!x.obs, duty: x.tier === 'first' && x.obs ? 'obs' : '' }); commit(); } break;
    case 'sf-name': { const v = el.value.trim(); if (!v) { render(); break; } sf.name = v; R.example = false; Object.values(R.shifts).forEach(x => x.doctors.forEach(y => { if (y.id === sf.id) y.name = v; })); commit(); break; }
    case 'sf-ext': sf.ext = el.value.trim(); Object.values(R.shifts).forEach(x => x.doctors.forEach(y => { if (y.id === sf.id) y.ext = sf.ext; })); commit(); break;
    case 'sf-tier': sf.tier = el.value; if (sf.tier !== 'first') sf.obs = false; R.teams.forEach(t => t.members.forEach(m => { if (m.staffId === sf.id) { if (sf.tier !== 'second') m.coordinator = false; if (sf.tier !== 'first') { m.obs = false; m.duty = ''; } if (sf.tier !== 'third') m.thirdRole = ''; } })); commit(); break;
    case 'sf-obs': sf.obs = el.checked; commit(); break;
    case 'set-ph': R.settings.dutyPhones = Object.assign({}, R.settings.dutyPhones, { [el.dataset.k]: el.value.trim() }); commit(); break;
    case 'set-morning': R.settings.morning = el.checked; ui.shiftDate = currentShiftDate(); pointShift(); commit(); break;
    case 'set-ws': case 'set-we': case 'set-hs': case 'set-ms': case 'set-me': {
      const v = el.value; if (!v) { render(); break; }
      R.settings[{ 'set-ws': 'weekdayStart', 'set-we': 'weekdayEnd', 'set-hs': 'holidayStart', 'set-ms': 'morningStart', 'set-me': 'morningEnd' }[a]] = v;
      futureShifts().forEach(rewindow); pointShift(); autoSchedule(); commit(); toast('Shift times updated'); break;
    }
    case 'set-th': R.settings.theatres = el.value.split(',').map(x => x.trim()).filter(Boolean); futureShifts().forEach(x => x.shift.theatres = R.settings.theatres.slice()); autoSchedule(); commit(); break;
    case 'set-wk': { const dd = Number(el.dataset.day); R.settings.weekend = el.checked ? [...new Set([...R.settings.weekend, dd])] : R.settings.weekend.filter(x => x !== dd); futureShifts().forEach(rewindow); pointShift(); autoSchedule(); commit(); break; }
    case 'sh-hol': S.holiday = el.checked; rewindow(S); logChange(el.checked ? 'Run as a holiday shift' : 'Run as a weekday shift'); autoSchedule(); commit(); break;
    case 'slot-coord': { const d0 = doc(el.dataset.id); S.doctors.forEach(x => { if (x.tier === 'second') x.coordinator = el.checked ? x.id === d0.id : (x.id === d0.id ? false : x.coordinator); }); logChange(`${d0.name} ${el.checked ? 'is' : 'is no longer'} coordinator`); autoSchedule(); commit(); break; }
    case 'slot-lp': { const d0 = doc(el.dataset.id); d0.listPrep = el.checked; logChange(`${d0.name} ${el.checked ? 'does' : 'no longer does'} list prep`); autoSchedule(); commit(); break; }
  }
});

document.addEventListener('submit', e => {
  if (e.target.id === 'taskForm') { e.preventDefault(); commitDraft(); }
  if (e.target.id === 'pinForm') { e.preventDefault(); pinSubmit(e.target.dataset.id); }
  if (e.target.id === 'signinForm') { e.preventDefault(); (async () => { try { await finishSignin(await rpc('oncall_signin', { p_code: sync.code, p_name: document.getElementById('siName').value, p_pin: document.getElementById('siPin').value })); } catch (err) { ui.signinErr = 'No connection to the team server.'; render(); } })(); }
  if (e.target.id === 'inviteForm') { e.preventDefault();
    const p1 = document.getElementById('ivPin').value, p2 = document.getElementById('ivPin2').value; ui.inviteOpen = true;
    if (!/^[0-9]{4,6}$/.test(p1)) { ui.signinErr = 'Use 4 to 6 digits for your PIN.'; render(); return; }
    if (p1 !== p2) { ui.signinErr = 'The two PINs do not match.'; render(); return; }
    (async () => { try { await finishSignin(await rpc('oncall_invite_redeem', { p_code: sync.code, p_invite: document.getElementById('ivCode').value, p_pin: p1 })); } catch (err) { ui.signinErr = 'No connection to the team server.'; render(); } })(); }
  if (e.target.id === 'importForm') { e.preventDefault(); if (canOt()) doImport(); }
  if (e.target.id === 'noraImportForm') { e.preventDefault(); if (canOt()) doNoraImport(); }
  if (e.target.id === 'rotaImportForm') { e.preventDefault(); if (canManage()) doRotaImport(); }
  if (e.target.id === 'prepForm') { e.preventDefault(); if (canOt()) savePrep(e.target); }
  if (e.target.id === 'cancelForm') { e.preventDefault(); if (canOt()) cancelCase(e.target.dataset.id, ((document.getElementById('cxOther') || {}).value || '').trim()); }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $layer.innerHTML) { draft = null; $layer.innerHTML = ''; } });
setInterval(() => { if (ui.tab === 'timeline' && !draft) { const n = $main.querySelectorAll('.now'); const L = shiftLen(); const nr = nowRel(); if (nr >= L) n.forEach(x => x.hidden = true); else n.forEach(x => x.style.left = (nr / 60 * 84) + 'px'); } }, 60000);

R = migrate(load()) || example();
ui.shiftDate = currentShiftDate(); pointShift();
if (R.example) save();
// ?join=CODE link from the team chat
(() => { try { const iv = new URLSearchParams(location.search).get('invite'); if (iv) { ui.invitePrefill = iv; ui.inviteOpen = true; } } catch (e) {} })();
(() => { try { const q = new URLSearchParams(location.search).get('join'); if (!q) return; history.replaceState(null, '', location.pathname + location.hash);
  const c = normCode(q); if (!c || c === sync.code) return; if (!sync.code) { joinBoard(c); } else { sync.joinPrefill = c; ui.tab = 'team'; toast('You are on another team board. Leave it first to join this one.'); } } catch (e) {} })();
if (ui.meId && ui.meId !== 'observer' && !staffOf(ui.meId)) ui.meId = '';
if (!readPref('tab') && junior()) ui.tab = 'mine';
render(); renderSyncChip();
if (sync.code && !ui.meId && R.staff.length) showWho();
if (sync.code) { refreshPins(); setInterval(() => { if (!document.hidden) refreshPins(); }, 60000); }
// roll over to the next shift when the current one ends, unless someone is looking at another date
setInterval(() => { const c = currentShiftDate(); if (ui.autoDate !== c) { const wasCurrent = ui.shiftDate === ui.autoDate; ui.autoDate = c; if (wasCurrent && !draft) { ui.shiftDate = c; pointShift(); safeRender(); } } }, 60000);
ui.autoDate = currentShiftDate();
if (sync.code) { setStatus('connecting'); sync.dirty ? push() : pull(true); }
let bgTick = 0;
setInterval(() => { if (!sync.code) return; if (document.hidden && !(alertsOn() && (++bgTick % 4 === 0))) return; sync.dirty ? push() : pull(false); }, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && sync.code) pull(false); });
document.addEventListener('focusout', () => setTimeout(() => { if (sync.needRender && !$main.contains(document.activeElement)) { sync.needRender = false; render(); } }, 0));
setInterval(renderSyncChip, 30000);
setInterval(() => { if ((ui.tab === 'ot' || ui.tab === 'nora' || ui.tab === 'map') && !draft && !document.hidden) safeRender(); }, 60000);
})();
</script>
