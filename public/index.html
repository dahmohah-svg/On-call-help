<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plan OT cases, APS reviews, emergency calls, preop assessments and list prep across the on-call team.">
<meta name="theme-color" content="#1d6b58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="On-Call">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>On-Call Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky shift bar + tabbed workspace (Board / Timeline / Tasks / Team). Task colours follow the ISO anaesthetic syringe-label convention. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #e8edeb;
  --fg: #16201d;
  --muted: #5b6a65;
  --line: #d3dbd8;
  --accent: #1d6b58;
  --accent-fg: #ffffff;
  --warn: #b25e00;
  --crit: #c62828;
  --ok: #2e7d32;
  /* syringe-label colours */
  --c-ot: #7b3fa3;       /* violet – vasopressors */
  --c-em: #e0262f;       /* fluorescent red – NMB */
  --c-aps: #1f6fc7;      /* blue – opioids */
  --c-pre: #d8a800;      /* yellow – induction agents */
  --c-list: #858b92;     /* grey – local anaesthetics */
  --c-obs: #d9654a;      /* salmon – antiemetics */
  --c-code: #0b93ad;     /* cyan – code blue team */
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #172120; --surface-2: #1f2b29; --fg: #e4ece9; --muted: #93a49e; --line: #2c3a37;
    --accent: #4fc0a0; --accent-fg: #06201a; --warn: #f0a24a; --crit: #ff6b6b; --ok: #6cc070;
    --c-ot: #b98ae0; --c-em: #ff5a5f; --c-aps: #6fb0ff; --c-pre: #f2cd3c; --c-list: #a6acb3; --c-obs: #ff9b80; --c-code: #45d0e8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #172120; --surface-2: #1f2b29; --fg: #e4ece9; --muted: #93a49e; --line: #2c3a37;
  --accent: #4fc0a0; --accent-fg: #06201a; --warn: #f0a24a; --crit: #ff6b6b; --ok: #6cc070;
  --c-ot: #b98ae0; --c-em: #ff5a5f; --c-aps: #6fb0ff; --c-pre: #f2cd3c; --c-list: #a6acb3; --c-obs: #ff9b80; --c-code: #45d0e8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1280px; margin: 0 auto; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* header */
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--f-mono); font-weight: 400; font-size: 12px; color: var(--muted); text-transform: none; letter-spacing: 0; }
.bar-stats { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.stat { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.stat b { color: var(--fg); font-family: var(--f-mono); }
.stat.alert { background: color-mix(in srgb, var(--crit) 15%, transparent); color: var(--crit); }
.stat.alert b { color: var(--crit); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 8px 14px 9px; font-family: var(--f-display); font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

main { padding-block: 16px 64px; display: grid; gap: 16px; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spacer { flex: 1; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 7px 12px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--crit); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn .dot, .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }

.t-ot { --c: var(--c-ot); } .t-em { --c: var(--c-em); } .t-aps { --c: var(--c-aps); } .t-pre { --c: var(--c-pre); } .t-list { --c: var(--c-list); } .t-obs { --c: var(--c-obs); } .t-code { --c: var(--c-code); }
.dot { background: var(--c); }

.banner { border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 14px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }

/* board */
.queue { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.queue.has { border-color: color-mix(in srgb, var(--crit) 50%, var(--line)); }
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.doc.off { opacity: .55; }
.doc-h { display: flex; gap: 8px; align-items: flex-start; }
.doc-name { font-weight: 700; font-size: 17px; line-height: 1.2; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.chip.tier2 { background: color-mix(in srgb, var(--c-ot) 16%, transparent); color: var(--c-ot); }
.chip.tier1 { background: color-mix(in srgb, var(--c-aps) 16%, transparent); color: var(--c-aps); }
.chip.coord { background: var(--accent); color: var(--accent-fg); }
.chip.obs { background: color-mix(in srgb, var(--c-obs) 18%, transparent); color: var(--c-obs); }
.chip.lp { background: color-mix(in srgb, var(--c-list) 22%, transparent); color: var(--fg); }
select.status { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 3px 6px; font-size: 13px; margin-left: auto; }
.load { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: flex; }
.load span { display: block; height: 100%; background: var(--c); }
.load-l { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.empty { color: var(--muted); font-size: 13px; }

/* task item */
.tasks { display: grid; gap: 6px; }
.task { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 6px; overflow: hidden; padding-left: 10px; }
.task.help { border-color: var(--crit); border-left-color: var(--c); box-shadow: 0 0 0 2px var(--crit); }
.help-row { grid-column: 1 / -1; margin: 0 8px 8px 0; padding: 6px 8px; border-radius: 5px; background: color-mix(in srgb, var(--crit) 12%, transparent); color: var(--crit); font-weight: 700; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.st-btns { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 8px 8px 0; }
.st-btns button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 9px 4px; font-weight: 700; font-size: 13px; }
.st-btns button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.st-btns button.b-help { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 50%, var(--line)); }
.st-btns button.b-help[aria-pressed="true"] { background: var(--crit); color: #fff; border-color: var(--crit); }
.st-sel { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; font-size: 12px; font-weight: 700; padding: 2px 6px; max-width: 130px; }
.st-sel.active { background: var(--c); color: #fff; border-color: var(--c); }
.st-sel.done { color: var(--ok); }
.st-sel.help { background: var(--crit); color: #fff; border-color: var(--crit); }
.who { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; font-size: 12.5px; padding: 1px 4px; max-width: 210px; }
.helpq { border: 2px solid var(--crit); border-radius: var(--r); background: color-mix(in srgb, var(--crit) 7%, var(--surface)); padding: 12px; display: grid; gap: 8px; }
.helpq h2 { color: var(--crit); }
.me-btn { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.me-btn.unset { border-color: var(--accent); color: var(--accent); }
.who-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.who-list .btn { justify-content: center; }
.who-list .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.post-l { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.chip.tier3 { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.chip.post-ot { background: color-mix(in srgb, var(--c-ot) 13%, transparent); color: var(--c-ot); }
.chip.post-out { background: color-mix(in srgb, var(--c-aps) 13%, transparent); color: var(--c-aps); }
.shiftnav { display: flex; align-items: center; gap: 4px; flex: 1 1 280px; min-width: 0; }
.shiftnav button.nav { border: 1px solid var(--line); background: var(--surface); border-radius: 6px; width: 30px; height: 28px; font-weight: 700; }
.shiftnav .lbl { font-family: var(--f-mono); font-size: 12px; color: var(--muted); padding: 0 4px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shiftnav button { flex: none; }
.shiftnav .lbl b { color: var(--fg); font-family: var(--f-body); font-size: 13px; }
.chip.duty { background: color-mix(in srgb, var(--c) 15%, transparent); color: var(--c); }
.duty-pick { display: flex; flex-wrap: wrap; gap: 4px; }
.duty-pick button { border: 1px solid var(--line); border-top: 3px solid var(--c); background: var(--surface-2); border-radius: 6px; padding: 4px 8px; font-size: 12.5px; font-weight: 700; }
.duty-pick button[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 20%, var(--surface)); border-color: var(--c); }
.chip.hol { background: color-mix(in srgb, var(--warn) 16%, transparent); color: var(--warn); }
.rota-t td, .rota-t th { white-space: nowrap; }
.rota-t tr.cur td { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.team-card { border: 1px solid var(--line); border-radius: 6px; padding: 10px; display: grid; gap: 8px; background: var(--bg); }
.log { font-size: 12.5px; color: var(--muted); display: grid; gap: 2px; margin: 0; padding-left: 16px; }
details.done-list summary { cursor: pointer; font-weight: 700; color: var(--muted); font-size: 13px; padding: 4px 0; }
.task.done { opacity: .5; }
.task.done .t-title { text-decoration: line-through; }
.task.active { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.t-main { padding: 8px 0; min-width: 0; display: grid; gap: 2px; }
.t-top { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 12px; color: var(--muted); }
.t-type { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--c); font-size: 13px; }
.t-title { font-weight: 700; overflow-wrap: anywhere; }
.t-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.t-side { padding: 8px 8px 8px 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.pri { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; white-space: nowrap; border: 1px solid currentColor; }
.pri.p1 { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); }
.pri.p2 { color: var(--warn); }
.pri.p3 { color: var(--muted); }
.pri.p4 { color: var(--muted); border-style: dashed; }
.st { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; font-size: 12px; padding: 2px 9px; font-weight: 700; white-space: nowrap; }
.st.active { background: var(--c); color: #fff; border-color: var(--c); }
.st.done { color: var(--ok); }
.icon-btn { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 2px 4px; text-decoration: underline; }
.late { color: var(--crit); font-weight: 700; }

/* timeline */
.tl-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; }
.tl { position: relative; min-width: max-content; }
.tl-row { display: flex; border-bottom: 1px solid var(--line); min-height: 52px; }
.tl-row:last-child { border-bottom: 0; }
.tl-lab { position: sticky; left: 0; z-index: 2; width: 132px; flex: none; background: var(--surface); border-right: 1px solid var(--line); padding: 6px 10px; font-size: 13px; display: flex; flex-direction: column; justify-content: center; }
.tl-lab b { font-size: 14px; }
.tl-lab span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tl-track { position: relative; flex: none; background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px var(--hw)); }
.tl-head .tl-track { background: none; }
.tl-head .tl-lab { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tl-hour { position: absolute; top: 0; bottom: 0; font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding: 16px 0 0 4px; border-left: 1px solid var(--line); }
.blk { position: absolute; top: 6px; bottom: 6px; border-radius: 5px; background: color-mix(in srgb, var(--c) 22%, var(--surface)); border-left: 3px solid var(--c); padding: 3px 6px; font-size: 11.5px; line-height: 1.25; overflow: hidden; border-top: 0; border-right: 0; border-bottom: 0; text-align: left; }
.blk b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk span { display: block; white-space: nowrap; overflow: hidden; color: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }
.blk.done { opacity: .45; }
.now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--crit); z-index: 1; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* filters */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 11px; font-size: 13px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* team */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
label.f { display: grid; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; min-width: 0; }
.f input, .f select, .f textarea { font-size: 15px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; }
.f textarea { min-height: 60px; resize: vertical; }
.team-t { width: 100%; border-collapse: collapse; font-size: 14px; }
.team-t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); }
.team-t td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.team-t input[type=text] { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 7px; width: 100%; min-width: 110px; }
.team-t select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px; }
.scroll-x { overflow-x: auto; }
.rules { font-size: 13.5px; color: var(--muted); margin: 0; padding-left: 18px; display: grid; gap: 4px; max-width: 70ch; }
.rules b { color: var(--fg); }

/* sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; padding: env(safe-area-inset-top, 0px) 0 0; }
.sheet { background: var(--surface); width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; border-radius: 14px 14px 0 0; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
@media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 14px; } }
.sheet h3 { margin: 0; font-family: var(--f-display); font-size: 22px; text-transform: uppercase; letter-spacing: .04em; }
.typepick { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; }
.typepick button { border: 1px solid var(--line); border-top: 4px solid var(--c); background: var(--bg); border-radius: 6px; padding: 8px 6px; font-weight: 700; font-size: 13px; }
.typepick button[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 18%, var(--surface)); border-color: var(--c); }
pre.handover { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; font-family: var(--f-mono); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; max-height: 50vh; overflow: auto; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-weight: 700; font-size: 14px; z-index: 30; }
.sync-chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); color: var(--muted); border: 0; }
.sync-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sync-chip.live { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.sync-chip.offline { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.sync-chip.error { color: var(--crit); background: color-mix(in srgb, var(--crit) 13%, transparent); }
.code { font-family: var(--f-mono); font-size: 24px; font-weight: 500; letter-spacing: .08em; }
.share-box { display: grid; gap: 10px; padding: 12px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
.share-box input { font-family: var(--f-mono); font-size: 13px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--crit); }
@media (prefers-reduced-motion: no-preference) { .btn, .seg button, nav.tabs button { transition: background .15s, border-color .15s, color .15s; } }
</style>

<header class="bar">
  <div class="wrap bar-in">
    <div class="brand">On-Call Board</div>
    <div class="shiftnav"><button class="nav" data-act="nav-prev" aria-label="Previous shift">‹</button><span class="lbl" id="shiftLabel"></span><button class="nav" data-act="nav-next" aria-label="Next shift">›</button><button class="me-btn" id="navNow" data-act="nav-now">Now</button></div>

// Boards saved before rotas existed held one shift: turn it into staff, one team and that shift.
function migrate(st) {

  if (st.v === 2) {
    const r = Object.assign(blankRoot(), st); r.settings = Object.assign(DEF_SETTINGS(), st.settings || {}); r.settings.dutyPhones = Object.assign(DEF_SETTINGS().dutyPhones, (st.settings || {}).dutyPhones || {}); return r;
  }

  const docs = st.doctors || [];
  r.staff = docs.map(d => ({ id: d.id, name: d.name, tier: d.tier || 'first', obs: !!d.obs, ext: d.ext || '' }));
  r.teams = [{ id: 'team-a', name: 'Team A', members: docs.map(d => ({ staffId: d.id, coordinator: !!d.coordinator, listPrep: !!d.listPrep, obs: !!d.obs })) }];
  if (st.shift && st.shift.theatres && st.shift.theatres.length) r.settings.theatres = st.shift.theatres.slice();
  const R0 = R; R = r;
  const date = (st.shift && st.shift.date) || todayISO();
  r.rota[date] = 'team-a';
  const sh = ensureShift(date);
  sh.doctors = docs.map(d => Object.assign({}, d));
  const oldStart = hm2abs((st.shift && st.shift.start) || '08:00'), newStart = hm2abs(sh.shift.start);
  sh.tasks = (st.tasks || []).map(t => { const x = Object.assign({}, t); if (x.start != null) { x.start = ((oldStart + x.start - newStart) % 1440 + 1440) % 1440; } return x; });

  return r;
}

/* ---------- rota, teams and shift dates ---------- */
function isoDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function addDays(iso, n) { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return isoDate(d); }
function dayLabel(iso, long) { const d = new Date(iso + 'T12:00:00'); return isNaN(d) ? iso : d.toLocaleDateString(undefined, long ? { weekday: 'long', day: 'numeric', month: 'long' } : { weekday: 'short', day: 'numeric', month: 'short' }); }
function isHoliday(date, sh) {
  if (sh && sh.holiday != null) return !!sh.holiday;
  const wd = new Date(date + 'T12:00:00').getDay();
  return R.settings.weekend.includes(wd) || R.settings.holidays.includes(date);
}
function keyDate(k) { return String(k).slice(0, 10); }
function keySession(k) { return String(k).endsWith('@am') ? 'am' : 'main'; }
function sessionsOf(date) { return !isHoliday(date, R.shifts[date]) && R.settings.morning ? [date + '@am', date] : [date]; }
function stepKey(key, dir) {
  const date = keyDate(key), list = sessionsOf(date); const i = list.indexOf(key); const j = (i < 0 ? (dir > 0 ? list.length - 1 : 0) : i) + dir;
  if (j >= 0 && j < list.length) return list[j];
  const nl = sessionsOf(addDays(date, dir)); return dir > 0 ? nl[0] : nl[nl.length - 1];
}
function windowForKey(key) {
  if (keySession(key) === 'am') { let m = hm2abs(R.settings.morningEnd) - hm2abs(R.settings.morningStart); if (m <= 0) m += 1440; return { start: R.settings.morningStart, mins: m }; }
  return windowFor(keyDate(key), isHoliday(keyDate(key), R.shifts[keyDate(key)]));
}
function sessionName(sh) { return sh.session === 'am' ? 'Morning duties' : isHoliday(sh.date, sh) ? 'Holiday' : 'Night'; }
function windowFor(date, hol) {
  const st = R.settings;
  if (hol) return { start: st.holidayStart, mins: 1440 };
  let m = hm2abs(st.weekdayEnd) - hm2abs(st.weekdayStart); if (m <= 0) m += 1440;
  return { start: st.weekdayStart, mins: m };
}
function startDT(date, start) { return new Date(date + 'T' + start.padStart(5, '0') + ':00'); }
function shiftEnds(key) { const sh = R.shifts[key]; const w = sh ? { start: sh.shift.start, mins: sh.shift.mins } : windowForKey(key); return startDT(keyDate(key), w.start).getTime() + w.mins * 60000; }
// the session running now (or the next one to start): last night's shift until it ends, then this morning, then tonight
function currentShiftDate() {
  const today = isoDate(new Date()); const y = addDays(today, -1);
  if (Date.now() < shiftEnds(y)) return y;
  for (const k of sessionsOf(today)) if (Date.now() < shiftEnds(k)) return k;
  return today;
}
function teamName(id) { const t = R.teams.find(x => x.id === id); return t ? t.name : ''; }
function staffOf(id) { return R.staff.find(x => x.id === id); }
function buildDoctors(teamId, session) {
  const tm = R.teams.find(t => t.id === teamId); if (!tm) return [];
  let ds = tm.members.map(m => { const sf = staffOf(m.staffId); if (!sf) return null;
    const duty = sf.tier === 'first' ? (m.duty || ((m.obs ?? sf.obs) ? 'obs' : '')) : '';
    return { id: sf.id, name: sf.name, tier: sf.tier, duty, obs: duty === 'obs', thirdRole: sf.tier === 'third' ? (m.thirdRole || '') : '', coordinator: !!m.coordinator && sf.tier === 'second', listPrep: !!m.listPrep, ext: sf.ext || '', status: 'available' }; }).filter(Boolean);
  if (session === 'am') { ds = ds.filter(d => (d.tier === 'first' && !(d.listPrep && !d.duty)) || d.tier === 'trainee').map(d => Object.assign(d, { coordinator: false, listPrep: false })); autoDuties(ds); }
  return ds;
}
// spread the four morning duties over the first on-calls who are available
// give a duty to any first on-call who has none, using the duties nobody holds yet
function autoDuties(ds) {
  const fs = ds.filter(d => d.tier === 'first' && d.status !== 'off');
  const taken = new Set(fs.map(d => d.duty).filter(Boolean));
  const free = Object.keys(DUTY).filter(k => !taken.has(k));
  fs.filter(d => !d.duty).forEach(d => { d.duty = free.shift() || 'em'; d.obs = d.duty === 'obs'; });
}
function dutyCls(k) { return TYPES[DUTY_TYPES[k][0]].cls; }
function dutyChips(d) { return d.duty ? `<span class="chip duty ${dutyCls(d.duty)}">${esc(DUTY[d.duty])}${dutyPhone(d.duty) ? ' · <span class="num">' + esc(dutyPhone(d.duty)) + '</span>' : ''}</span>` : (d.tier === 'first' ? '<span class="chip">No duty</span>' : ''); }

function junior() { const r = role(); return r === 'first' || r === 'trainee'; }
function ensureShift(key) {
  let sh = R.shifts[key];
  const date = keyDate(key), session = keySession(key);
  if (!sh) {
    const w = windowForKey(key); const teamId = R.rota[date] || '';
    sh = R.shifts[key] = { key, date, session, teamId, holiday: null, shift: { date, start: w.start, mins: w.mins, theatres: R.settings.theatres.slice() }, doctors: buildDoctors(teamId, session), tasks: [], log: [] };
  }
  sh.key = key; sh.session = session; if (!sh.log) sh.log = [];

}
function pointShift() { if (!ui.shiftDate) ui.shiftDate = currentShiftDate(); S = ensureShift(ui.shiftDate); }
function logChange(text) { S.log = S.log || []; S.log.push({ id: uid(), at: new Date().toISOString(), by: myName() || 'Someone', text }); }
// Change a shift's hours (holiday toggle or new settings) while keeping placed tasks at the same clock time.
function rewindow(sh) {
  const w = windowForKey(sh.key || sh.date);
  if (sh.shift.start === w.start && sh.shift.mins === w.mins) return;
  const diff = hm2abs(w.start) - hm2abs(sh.shift.start);

}
function applyTeamToShift(sh, teamId) {

  const ids = new Set(sh.doctors.map(d => d.id));
  sh.tasks.forEach(t => { if (t.doctorId && !ids.has(t.doctorId)) { t.doctorId = null; t.fixDoctor = false; t.fixStart = false; if (t.status === 'pending') t.start = null; } });

}
function pruneShifts() { const cut = addDays(todayISO(), -60); Object.keys(R.shifts).forEach(k => { if (k < cut) delete R.shifts[k]; }); Object.keys(R.rota).forEach(k => { if (k < cut) delete R.rota[k]; }); }

/* ---------- time helpers (minutes from shift start) ---------- */
function hm2abs(hm) { if (!hm || !/^\d{1,2}:\d{2}$/.test(hm)) return null; const [h, m] = hm.split(':').map(Number); return h * 60 + m; }

// minutes since the viewed shift started; Infinity when that shift is not running now
function nowRel() { const r = Math.floor((Date.now() - startDT(S.shift.date, S.shift.start).getTime()) / 60000); return r >= 0 && r < shiftLen() ? r : Infinity; }

/* ---------- scheduling ---------- */
function doc(id) { return S.doctors.find(d => d.id === id); }
function busyOf(pred) { return S.tasks.filter(t => t.start != null && t.doctorId !== undefined && pred(t)).map(t => [t.start, t.start + t.duration]); }
function findSlot(lists, earliest, dur) {
  const iv = lists.flat().sort((a, b) => a[0] - b[0]);
  let t = earliest;
  for (const [s, e] of iv) { if (e <= t) continue; if (s >= t + dur) break; t = Math.max(t, e); }
  return t;
}
function inOT(d) { return d.tier === 'first' && !!d.post && d.post.where === 'ot'; }
function eligible(t) {
  const avail = S.doctors.filter(d => d.status !== 'off' && d.tier !== 'third' && d.tier !== 'trainee');
  const dk = dutyOfType(t.type);
  if (S.session === 'am' && dk && dk !== 'obs') {   // morning: the first on-call holding that duty
    const fs = avail.filter(d => d.tier === 'first' && !d.obs);
    const c = fs.filter(d => d.duty === dk);
    return c.length ? c : fs.length ? fs : avail;
  }
  const by = tier => avail.filter(d => d.tier === tier);
  const gen = avail.filter(d => !d.obs);                   // obs & gyne on-call stays on labour ward
  const genBy = tier => gen.filter(d => d.tier === tier);
  let c;
  if (t.type === 'obs') c = avail.filter(d => d.obs || d.tier === 'second');
  else if (t.type === 'ot') c = genBy('second').concat(gen.filter(inOT));   // first on-calls posted inside OT can take cases
  else if (t.type === 'em' || t.type === 'code') c = gen;
  else if (t.type === 'list') c = avail.filter(d => d.listPrep);
  else c = genBy('first');
  if (!c.length) c = t.type === 'list' ? genBy('first') : gen;
  if (!c.length) c = avail;
  return c;
}
function penalty(d, t) {
  let p = 0;
  if (d.status === 'busy') p += 30;
  if (inOT(d)) { if (t.type === 'ot') { p += (t.theatre && d.post.theatre && d.post.theatre !== t.theatre) ? 60 : -5; } else if (t.type !== 'list') p += 120; } // posted in OT: keep them there
  if (t.type === 'obs' && !d.obs) p += t.priority === 1 ? 15 : 90;   // second on-call covers obs only when needed
  if ((t.type === 'ot' || t.type === 'obs') && d.coordinator) p += 45;           // keep coordinator free to coordinate when possible
  if ((t.type === 'em' || t.type === 'code') && d.tier === 'second') p += t.priority === 1 ? 10 : 40; // first on-call attends calls first
  { const dk = dutyOfType(t.type); if (dk && d.tier === 'first' && d.duty) p += d.duty === dk ? -5 : (S.session === 'am' ? 120 : 45); }   // the duty holder takes their own work first

}
function inTheatre(x) { return (x.type === 'ot' || x.type === 'obs') && !!x.theatre; }
function theatreCase(x) { return x.type === 'ot' || (x.type === 'obs' && !!x.theatre); }
function load_(d) { return S.tasks.filter(t => t.doctorId === d.id && t.status !== 'done').reduce((a, t) => a + t.duration, 0); }

function autoSchedule() {
  const L = shiftLen();
  for (const t of S.tasks) {
    if (t.status !== 'pending') continue;
    if (!t.fixDoctor) t.doctorId = null;
    if (!t.fixStart) t.start = null;
    if (t.type === 'ot' && t.theatreAuto) { t.theatre = ''; t.theatreAuto = false; }
  }
  const queue = S.tasks.filter(t => t.status === 'pending' && t.start == null)
    .sort((a, b) => a.priority - b.priority || rel(a.earliest) - rel(b.earliest) || a.seq - b.seq);
  for (const t of queue) {
    const cands = t.fixDoctor && doc(t.doctorId) ? [doc(t.doctorId)] : eligible(t);
    const theatres = t.type === 'ot' ? (t.theatre ? [t.theatre] : (S.shift.theatres.length ? S.shift.theatres : [''])) : (t.type === 'obs' && t.theatre ? [t.theatre] : [null]);
    const earliest = Math.min(rel(t.earliest), L - 1);
    let best = null;
    for (const d of cands) {
      const dBusy = busyOf(x => x.doctorId === d.id);
      const ths = t.type === 'ot' && !t.theatre && inOT(d) && d.post.theatre ? [d.post.theatre] : theatres;
      for (const th of ths) {
        const tBusy = th ? busyOf(x => inTheatre(x) && x.theatre === th) : [];
        const slot = findSlot([dBusy, tBusy], earliest, t.duration);
        const score = slot + penalty(d, t) + load_(d) / 1000;
        if (!best || score < best.score) best = { score, slot, d, th };
      }
    }
    if (best) {
      t.doctorId = best.d.id; t.start = best.slot;
      if (t.type === 'ot' && !t.theatre && best.th) { t.theatre = best.th; t.theatreAuto = true; }
    }
  }
}

/* ---------- derived ---------- */
function stats() {
  const open = S.tasks.filter(t => t.status !== 'done');
  return {
    open: open.length,
    unassigned: open.filter(t => !t.doctorId).length,
    active: S.tasks.filter(t => t.status === 'active').length,
    help: S.tasks.filter(t => t.status === 'help').length,
    p1: open.filter(t => t.priority === 1).length,

}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function tierLabel(d) { return d.tier === 'trainee' ? 'Trainee on-call' : d.tier === 'third' ? '3rd on-call' + (d.thirdRole ? ' · ' + THIRD_ROLE[d.thirdRole] : '') : d.tier === 'second' ? '2nd on-call' : d.duty ? '1st on-call · ' + DUTY[d.duty] : '1st on-call'; }
function tierShort(d) { return d.tier === 'trainee' ? 'Trainee' : d.tier === 'third' ? '3rd' : d.tier === 'second' ? '2nd' : '1st'; }
/* roles: who is using this phone */
function meDoc() { return ui.meId && ui.meId !== 'observer' ? doc(ui.meId) : null; }
function meStaff() { return ui.meId && ui.meId !== 'observer' ? staffOf(ui.meId) : null; }
// role on the shift being viewed; 'offduty' = in the department but not on this shift
function role() { const d = meDoc(); if (d) return d.tier; const sf = meStaff();
  if (sf && S && S.session === 'am') {   // the day's second and third on-calls run the morning too
    const night = R.shifts[S.date]; const onDay = night ? night.doctors.some(x => x.id === sf.id) : (R.teams.find(t => t.id === R.rota[S.date]) || { members: [] }).members.some(m => m.staffId === sf.id);
    if (onDay && (sf.tier === 'second' || sf.tier === 'third')) return sf.tier;
  } if (sf) return sf.tier === 'third' ? 'third' : 'offduty'; return ui.meId === 'observer' ? 'third' : 'none'; }
function canEdit() { const r = role(); return r !== 'third' && r !== 'offduty'; }
function canManage() { const r = role(); const sf = meStaff(); return r === 'none' || r === 'second' || (!!sf && sf.tier === 'second'); }
function canAssign() { const r = role(); return r === 'second' || r === 'none'; }
function canEditTask(t) { return canEdit() && (!junior() || !t.doctorId || t.doctorId === ui.meId || t.postedBy === myName()); }
function canStatus(t) { return canEdit() && (!junior() || t.doctorId === ui.meId); }
function myName() { const d = meDoc() || meStaff(); return d ? d.name : (ui.meId === 'observer' ? 'Observer' : ''); }
function postLabel(d) { return inOT(d) ? 'In OT' + (d.post.theatre ? ' · ' + d.post.theatre : '') : 'Outside OT'; }
function postChip(d) { return d.tier === 'first' ? `<span class="chip ${inOT(d) ? 'post-ot' : 'post-out'}">${esc(postLabel(d))}</span>` : ''; }
function postSelect(d) {
  const v = inOT(d) ? 'ot:' + (d.post.theatre || '') : 'out';
  const opts = [['out', 'Outside OT – wards, ED, APS'], ['ot:', 'Inside OT – any theatre']].concat(S.shift.theatres.map(th => ['ot:' + th, 'Inside OT – ' + th]));
  return `<label class="post-l">Post<select class="who" data-act="post" data-id="${d.id}" aria-label="Post ${esc(d.name)}">${opts.map(([k, l]) => `<option value="${esc(k)}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
}
function assignOpts(t) {
  return `<option value="">${t.doctorId ? 'Auto (best fit)' : 'Unassigned – pick'}</option>` + S.doctors.filter(d => d.tier !== 'third').map(d =>
    `<option value="${d.id}" ${t.doctorId === d.id ? 'selected' : ''}>${esc(d.name)} · ${tierShort(d)}${d.obs ? ' obs' : ''}${inOT(d) ? ' (in OT)' : ''}${d.status === 'off' ? ' (off)' : ''}</option>`).join('');

function addButtons() {

    `<button class="btn sm ${v.cls}" data-act="new" data-type="${k}"><span class="dot"></span>${v.short}</button>`).join('') +

}

function roBanner() {
  const msg = role() === 'offduty' ? `<b>You are not on this shift.</b> You can see it, but only the doctors on it can change it.` : `<b>Observer view.</b> You can see everything the team is doing, but not change it.`;
  return `<div class="banner"><span>${msg}</span><button class="btn sm" data-act="handover">Handover text</button></div>`;
}
function carryBanner() {
  const prev = R.shifts[stepKey(S.key, -1)]; if (!prev || !canEdit()) return '';

}

}

function exampleBanner() {

function docCard(d) {

function viewTimeline() {

  list.sort((a, b) => (a.status === 'done') - (b.status === 'done') || (a.start ?? 1e9) - (b.start ?? 1e9) || a.priority - b.priority);
  let h = addButtons();

function viewOT() {
  const lp = S.doctors.filter(d => d.listPrep).map(d => d.name).join(', ') || 'not set';
  const cases = S.tasks.filter(theatreCase);
  let h = canEdit() ? `<div class="row"><button class="btn sm t-ot" data-act="new" data-type="ot"><span class="dot"></span>Add OT case</button><span class="spacer"></span><button class="btn sm" data-act="otlist">Copy OT list</button><button class="btn primary sm" data-act="schedule">Auto-schedule</button></div>` : roBanner();
  const firsts = S.doctors.filter(d => d.tier === 'first');
  if (firsts.length) h += `<div class="banner"><span><b>First on-calls:</b> ${firsts.map(d => esc(d.name) + ' – ' + esc(postLabel(d))).join(' · ')}</span></div>`;
  h += `<div class="banner"><span>List prepared by <b>${esc(lp)}</b>. Cases run in priority order (NCEPOD, or LSCS category for obstetric cases), then by the order below. Move a case up or down to change who goes first within the same priority.</span></div>`;
  const ths = [...S.shift.theatres, ''];
  for (const th of ths) {
    const cs = cases.filter(t => (t.theatre || '') === th).sort((a, b) => (a.start ?? 1e9) - (b.start ?? 1e9) || a.seq - b.seq);
    if (!cs.length && th === '') continue;
    h += `<section class="panel"><div class="row"><h2>${th ? esc(th) : 'No theatre yet'}</h2><span class="spacer"></span><span class="empty">${cs.filter(c => c.status !== 'done').length} open</span></div>`;
    h += cs.length ? `<div class="tasks">${cs.map((t, i) => `<div class="row" style="flex-wrap:nowrap;align-items:stretch"><div style="display:${canEdit() ? 'flex' : 'none'};flex-direction:column;gap:2px;justify-content:center"><button class="btn sm ghost" data-act="up" data-id="${t.id}" aria-label="Move up" ${i === 0 ? 'disabled' : ''}>▲</button><button class="btn sm ghost" data-act="down" data-id="${t.id}" aria-label="Move down" ${i === cs.length - 1 ? 'disabled' : ''}>▼</button></div><div style="flex:1;min-width:0">${taskItem(t)}</div></div>`).join('')}</div>` : '<p class="empty">No cases booked.</p>';
    h += `</section>`;
  }
  return h;
}

  if (v === 'active' && prev !== 'help') { const nr = nowRel(); if (nr < shiftLen() && (t.start == null || Math.abs(nr - t.start) > 5)) t.start = nr; }
  if (v === 'help') { t.helpAt = new Date().toISOString(); t.helpBy = ''; if (t.start == null) { const nr = nowRel(); t.start = nr < shiftLen() ? nr : 0; } }
  else { t.helpBy = ''; }
  if (v === 'done') t.doneBy = myName();
  if (v === 'pending') autoSchedule();
  commit();
  toast(v === 'help' ? 'Help requested – the whole team can see it' : v === 'done' ? 'Marked done' : 'Status: ' + ST[v]);
}

/* ---------- events ---------- */
let toastT;
function toast(msg) { clearTimeout(toastT); let el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = msg; el.hidden = false; toastT = setTimeout(() => el.hidden = true, 2600); }
function commit() { pruneShifts(); save(); render(); markDirty(); }

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab; ui.confirmReset = false; writePref('tab', ui.tab); render(); window.scrollTo(0, 0);
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act; const id = el.dataset.id;
  if (a === 'close-bg' && e.target !== el) return;
  const t = id ? S.tasks.find(x => x.id === id) : null;
  const viewOnly = new Set(['close', 'close-bg', 'handover', 'otlist', 'copy', 'filter', 'goteam', 'copy-code', 'copy-link', 'whoami', 'setme', 'sync-join', 'sync-create', 'sync-leave', 'nav-prev', 'nav-next', 'nav-now', 'openshift', 'reset-no']);
  const manage = new Set(['fill', 'team-add', 'team-del', 'tm-del', 'sf-add', 'sf-del', 'hol-add', 'hol-del', 'reset', 'reset-yes']);
  if (manage.has(a)) { if (!canManage()) { toast('Only second on-calls can change the rota and teams'); return; } }
  else if (!canEdit() && !viewOnly.has(a)) { toast(role() === 'offduty' ? 'You are not on this shift – view only' : 'Observer view – read-only'); return; }
  if (a === 'edit' && t && !canEditTask(t)) { toast("Only the second on-call can change another doctor's task"); return; }
  switch (a) {
    case 'whoami': showWho(); break;
    case 'nav-prev': case 'nav-next': ui.shiftDate = stepKey(S.key, a === 'nav-prev' ? -1 : 1); pointShift(); render(); break;
    case 'nav-now': ui.shiftDate = currentShiftDate(); pointShift(); render(); break;
    case 'openshift': ui.shiftDate = el.dataset.date; pointShift(); if (ui.tab === 'team' || ui.tab === 'mine' && !meDoc()) ui.tab = 'board'; writePref('tab', ui.tab); render(); window.scrollTo(0, 0); break;
    case 'swap': showSwap(id); break;
    case 'autoduty': autoDuties(S.doctors); logChange('Empty duties filled'); autoSchedule(); commit(); toast('Every first on-call now has a duty'); break;
    case 'addto': showSwap(null); break;
    case 'swapto': {
      const from = doc(el.dataset.from), sf = staffOf(id); if (!from || !sf) break;
      const nd = Object.assign({}, from, { id: sf.id, name: sf.name, ext: sf.ext || '', status: 'available' });
      S.doctors = S.doctors.map(x => x.id === from.id ? nd : x);
      S.tasks.forEach(t => { if (t.doctorId === from.id) t.doctorId = sf.id; });
      logChange(`${sf.name} replaced ${from.name} (${tierLabel(from)})`);
      $layer.innerHTML = ''; autoSchedule(); commit(); toast(`${sf.name} now covers ${from.name}'s place`); break;
    }
    case 'addpick': { const sf = staffOf(id); if (!sf) break; S.doctors.push({ id: sf.id, name: sf.name, tier: sf.tier, obs: !!sf.obs && sf.tier === 'first', duty: sf.tier === 'first' && sf.obs ? 'obs' : '', coordinator: false, listPrep: false, ext: sf.ext || '', status: 'available' });
      logChange(`${sf.name} added to the shift (${tierLabel(sf)})`); $layer.innerHTML = ''; autoSchedule(); commit(); toast(`${sf.name} added`); break; }
    case 'slot-remove': { const d0 = doc(id); if (!d0) break; S.doctors = S.doctors.filter(x => x.id !== id);
      S.tasks.forEach(x => { if (x.doctorId === id) { x.doctorId = null; x.fixDoctor = false; x.fixStart = false; if (x.status === 'pending') x.start = null; } });
      logChange(`${d0.name} removed from the shift`); $layer.innerHTML = ''; autoSchedule(); commit(); toast(`${d0.name} removed – their tasks were reassigned`); break; }
    case 'carry': {
      const prev = R.shifts[stepKey(S.key, -1)]; if (!prev) break; let n = 0;
      prev.tasks.filter(t => t.status !== 'done' && !t.carriedTo).forEach(t => { n++; t.carriedTo = S.key;
        S.tasks.push(Object.assign({}, t, { id: uid(), doctorId: null, fixDoctor: false, fixStart: false, start: null, status: t.status === 'help' ? 'pending' : 'pending', helpBy: '', carriedTo: undefined, carriedFrom: prev.date, earliest: S.shift.start, seq: Math.max(0, ...S.tasks.map(x => x.seq || 0)) + 1, notes: (t.notes ? t.notes + ' · ' : '') + 'Carried over from ' + dayLabel(prev.date) })); });
      logChange(`${n} unfinished task${n === 1 ? '' : 's'} carried over from ${dayLabel(prev.date)}`); autoSchedule(); commit(); toast(`${n} task${n === 1 ? '' : 's'} carried over and assigned`); break;
    }
    case 'fill': {
      const from = document.getElementById('fillFrom').value || keyDate(currentShiftDate()), firstId = document.getElementById('fillFirst').value, n = Number(document.getElementById('fillDays').value) || 28;
      const order = R.teams.map(t => t.id); let i = Math.max(0, order.indexOf(firstId));
      for (let k = 0; k < n; k++, i++) { const dt = addDays(from, k); R.rota[dt] = order[i % order.length]; [dt, dt + '@am'].forEach(kk => { const sh = R.shifts[kk]; if (sh && sh.teamId !== R.rota[dt]) applyTeamToShift(sh, R.rota[dt]); }); }
      pointShift(); commit(); toast(`Rota filled for ${n} days`); break;
    }
    case 'team-add': R.teams.push({ id: uid(), name: 'Team ' + String.fromCharCode(65 + R.teams.length), members: [] }); commit(); break;
    case 'team-del': { const tid = el.dataset.team; R.teams = R.teams.filter(t => t.id !== tid); Object.keys(R.rota).forEach(k => { if (R.rota[k] === tid) delete R.rota[k]; }); commit(); break; }
    case 'tm-del': { const tm = R.teams.find(t => t.id === el.dataset.team); tm.members = tm.members.filter(m => m.staffId !== id); commit(); break; }
    case 'sf-add': { const k = el.dataset.tier; R.staff.push({ id: uid(), name: { third: 'New 3rd on-call', second: 'New 2nd on-call', first: 'New 1st on-call', obs: 'New OB/GYN on-call', trainee: 'New trainee' }[k], tier: k === 'obs' ? 'first' : k, obs: k === 'obs', ext: '' }); commit(); break; }
    case 'sf-del': { R.staff = R.staff.filter(x => x.id !== id); R.teams.forEach(t => t.members = t.members.filter(m => m.staffId !== id)); commit(); break; }
    case 'hol-add': { const v = document.getElementById('holDate').value; if (!v) { toast('Pick a date first'); break; } if (!R.settings.holidays.includes(v)) R.settings.holidays.push(v); const sh = R.shifts[v]; if (sh) rewindow(sh); commit(); toast(dayLabel(v) + ' is now a holiday shift'); break; }
    case 'hol-del': { const v = el.dataset.date; R.settings.holidays = R.settings.holidays.filter(x => x !== v); const sh = R.shifts[v]; if (sh) rewindow(sh); commit(); break; }
    case 'setme': {
      ui.meId = id; writePref('meId', id); $layer.innerHTML = ''; ui.shiftDate = currentShiftDate(); pointShift();
      const r = role(); ui.tab = junior() ? 'mine' : r === 'third' ? 'board' : (ui.tab === 'team' ? 'board' : ui.tab); writePref('tab', ui.tab);
      render(); window.scrollTo(0, 0); toast(meDoc() ? 'You are ' + meDoc().name : 'Observer view – read-only'); break;
    }
    case 'setst': setTaskStatus(t, el.dataset.v); break;
    case 'ihelp': t.helpBy = myName() || 'Someone'; commit(); toast('The team can see you are going'); break;
    case 'new': newTask(el.dataset.type); break;
    case 'edit': ui.confirmDel = false; openTask(t); break;
    case 'close': case 'close-bg': draft = null; ui.confirmDel = false; $layer.innerHTML = ''; break;
    case 'ftype': readForm(); draft.type = el.dataset.type; draft.duration = draft._new ? TYPES[draft.type].dur : draft.duration; renderSheet(); break;
    case 'del': readForm(); ui.confirmDel = true; renderSheet(); break;
    case 'del-no': readForm(); ui.confirmDel = false; renderSheet(); break;
    case 'del-yes': S.tasks = S.tasks.filter(x => x.id !== draft.id); draft = null; ui.confirmDel = false; $layer.innerHTML = ''; autoSchedule(); commit(); toast('Task deleted'); break;
    case 'schedule': autoSchedule(); commit(); { const s = stats(); toast(s.unassigned ? `${s.unassigned} task(s) could not be placed` : 'Schedule updated'); } break;
    case 'handover': showText('Handover / team update', handoverText()); break;
    case 'otlist': showText('OT list', otListText()); break;
    case 'copy': {
      const pre = document.getElementById('htext'); const txt = pre.textContent;
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Text selected – copy it with your device'); };
      try { navigator.clipboard.writeText(txt).then(() => toast('Copied'), fallback); } catch (err) { fallback(); }
      break;
    }
    case 'filter': ui.filter = el.dataset.f; render(); break;
    case 'goteam': ui.tab = 'team'; writePref('tab', 'team'); render(); window.scrollTo(0, 0); break;
    case 'sync-create': createBoard(); break;
    case 'sync-join': joinBoard(document.getElementById('joinCode').value); break;
    case 'sync-leave': leaveBoard(); break;
    case 'copy-code': copyText(sync.code, null); break;
    case 'copy-link': copyText(shareLink(), document.getElementById('shareLink')); break;
    case 'up': case 'down': {
      const th = t.theatre || '';
      const cs = S.tasks.filter(x => theatreCase(x) && (x.theatre || '') === th).sort((p, q) => (p.start ?? 1e9) - (q.start ?? 1e9) || p.seq - q.seq);
      const i = cs.indexOf(t); const j = a === 'up' ? i - 1 : i + 1; if (j < 0 || j >= cs.length) break;
      const o = cs[j];
      // swap order; equalise priority so the swap holds under NCEPOD ordering only when categories match
      [t.seq, o.seq] = [o.seq, t.seq];
      if (t.seq === o.seq) { a === 'up' ? t.seq-- : t.seq++; }
      if (t.priority !== o.priority) toast('Different category – higher priority still goes first');
      for (const x of [t, o]) if (x.status === 'pending' && !x.fixStart) { x.start = null; }
      // keep both in this theatre while reordering
      for (const x of [t, o]) if (x.theatreAuto) x.theatreAuto = false;
      autoSchedule(); commit(); break;
    }
    case 'clear-example': R = starterRoot(); ui.meId = ''; writePref('meId', ''); ui.shiftDate = currentShiftDate();
      for (let k = -1; k < 28; k++) R.rota[addDays(keyDate(ui.shiftDate), k)] = 'team-a';
      pointShift(); ui.tab = 'team'; writePref('tab', 'team'); commit(); toast('Blank board – add your staff and teams'); break;
    case 'reset': ui.confirmReset = true; render(); break;
    case 'reset-no': ui.confirmReset = false; render(); break;
    case 'reset-yes': R = blankRoot(); ui.shiftDate = currentShiftDate(); pointShift(); ui.confirmReset = false; commit(); toast('All data deleted'); break;
  }
});

document.addEventListener('change', e => {
  const el = e.target; const a = el.dataset.act; if (!a) return;
  const d = el.dataset.id ? doc(el.dataset.id) : null;
  const manageCh = new Set(['set-morning', 'set-ms', 'set-me', 'rota-team', 'tm-coord', 'tm-lp', 'tm-duty', 'tm-third', 'set-ph', 'tm-add', 'tm-name', 'sf-name', 'sf-tier', 'sf-obs', 'sf-ext', 'set-ws', 'set-we', 'set-hs', 'set-th', 'set-wk']);
  if (manageCh.has(a)) { if (!canManage()) { render(); toast('Only second on-calls can change the rota and teams'); return; } }
  else if (!canEdit() && a !== 'showdone') { render(); toast(role() === 'offduty' ? 'You are not on this shift – view only' : 'Observer view – read-only'); return; }
  const tm = el.dataset.team ? R.teams.find(t => t.id === el.dataset.team) : null;
  const mem = tm && el.dataset.id ? tm.members.find(m => m.staffId === el.dataset.id) : null;
  const sf = el.dataset.id ? staffOf(el.dataset.id) : null;
  const futureShifts = () => Object.values(R.shifts).filter(x => x.date >= keyDate(currentShiftDate()));
  switch (a) {
    case 'duty': d.duty = el.value; d.obs = el.value === 'obs'; logChange(`${d.name}: ${el.value ? DUTY[el.value] : 'no duty'}`); autoSchedule(); commit(); toast(`${d.name}: ${el.value ? DUTY[el.value] : 'no duty'}`); break;
    case 'setstatus': setTaskStatus(S.tasks.find(x => x.id === el.dataset.id), el.value); break;
    case 'assign': {
      const t = S.tasks.find(x => x.id === el.dataset.id); if (!t) break;
      if (el.value) { t.doctorId = el.value; t.fixDoctor = true; } else { t.fixDoctor = false; t.fixStart = false; }
      if (t.status === 'pending' && !t.fixStart) t.start = null;
      autoSchedule(); commit(); const nd = doc(t.doctorId);
      toast(nd ? `${t.title || TYPES[t.type].short} → ${nd.name}${t.start != null ? ' at ' + fmt(t.start) : ''}` : 'Back to auto-assign'); break;
    }
    case 'post': {
      d.post = el.value === 'out' ? { where: 'out', theatre: '' } : { where: 'ot', theatre: el.value.slice(3) }; logChange(`${d.name} posted ${postLabel(d)}`);
      autoSchedule(); commit(); toast(`${d.name}: ${postLabel(d)}`); break;
    }
    case 'docstatus': d.status = el.value; logChange(`${d.name}: ${DOC_STATUS[d.status]}`); autoSchedule(); commit(); toast(`${d.name}: ${DOC_STATUS[d.status]} – schedule updated`); break;
    case 'showdone': ui.showDone = el.checked; render(); break;
    case 'rota-team': {
      const dt = el.dataset.date; if (el.value) R.rota[dt] = el.value; else delete R.rota[dt];
      [dt, dt + '@am'].forEach(kk => { const sh = R.shifts[kk]; if (sh) { const oldName = teamName(sh.teamId); const prevS = S; S = sh; applyTeamToShift(sh, el.value); logChange(`Team changed${oldName ? ' from ' + oldName : ''} to ${teamName(el.value) || 'none'}`); S = prevS; } });
      pointShift(); commit(); toast(`${dayLabel(dt)}: ${teamName(el.value) || 'no team'}`); break;
    }
    case 'tm-name': tm.name = el.value.trim() || tm.name; commit(); break;
    case 'tm-coord': tm.members.forEach(m => m.coordinator = m.staffId === el.dataset.id); commit(); break;
    case 'tm-lp': mem.listPrep = el.checked; commit(); break;
    case 'tm-duty': mem.duty = el.value; mem.obs = el.value === 'obs'; commit(); break;
    case 'tm-third': mem.thirdRole = el.value; commit(); break;
    case 'tm-add': if (el.value) { const x = staffOf(el.value); tm.members.push({ staffId: x.id, coordinator: false, listPrep: false, obs: !!x.obs, duty: x.tier === 'first' && x.obs ? 'obs' : '' }); commit(); } break;
    case 'sf-name': { const v = el.value.trim(); if (!v) { render(); break; } sf.name = v; R.example = false; Object.values(R.shifts).forEach(x => x.doctors.forEach(y => { if (y.id === sf.id) y.name = v; })); commit(); break; }
    case 'sf-ext': sf.ext = el.value.trim(); Object.values(R.shifts).forEach(x => x.doctors.forEach(y => { if (y.id === sf.id) y.ext = sf.ext; })); commit(); break;
    case 'sf-tier': sf.tier = el.value; if (sf.tier !== 'first') sf.obs = false; R.teams.forEach(t => t.members.forEach(m => { if (m.staffId === sf.id) { if (sf.tier !== 'second') m.coordinator = false; if (sf.tier !== 'first') { m.obs = false; m.duty = ''; } if (sf.tier !== 'third') m.thirdRole = ''; } })); commit(); break;
    case 'sf-obs': sf.obs = el.checked; commit(); break;
    case 'set-ph': R.settings.dutyPhones = Object.assign({}, R.settings.dutyPhones, { [el.dataset.k]: el.value.trim() }); commit(); break;
    case 'set-morning': R.settings.morning = el.checked; ui.shiftDate = currentShiftDate(); pointShift(); commit(); break;
    case 'set-ws': case 'set-we': case 'set-hs': case 'set-ms': case 'set-me': {
      const v = el.value; if (!v) { render(); break; }
      R.settings[{ 'set-ws': 'weekdayStart', 'set-we': 'weekdayEnd', 'set-hs': 'holidayStart', 'set-ms': 'morningStart', 'set-me': 'morningEnd' }[a]] = v;
      futureShifts().forEach(rewindow); pointShift(); autoSchedule(); commit(); toast('Shift times updated'); break;
    }
    case 'set-th': R.settings.theatres = el.value.split(',').map(x => x.trim()).filter(Boolean); futureShifts().forEach(x => x.shift.theatres = R.settings.theatres.slice()); autoSchedule(); commit(); break;
    case 'set-wk': { const dd = Number(el.dataset.day); R.settings.weekend = el.checked ? [...new Set([...R.settings.weekend, dd])] : R.settings.weekend.filter(x => x !== dd); futureShifts().forEach(rewindow); pointShift(); autoSchedule(); commit(); break; }
    case 'sh-hol': S.holiday = el.checked; rewindow(S); logChange(el.checked ? 'Run as a holiday shift' : 'Run as a weekday shift'); autoSchedule(); commit(); break;
    case 'slot-coord': { const d0 = doc(el.dataset.id); S.doctors.forEach(x => { if (x.tier === 'second') x.coordinator = el.checked ? x.id === d0.id : (x.id === d0.id ? false : x.coordinator); }); logChange(`${d0.name} ${el.checked ? 'is' : 'is no longer'} coordinator`); autoSchedule(); commit(); break; }
    case 'slot-lp': { const d0 = doc(el.dataset.id); d0.listPrep = el.checked; logChange(`${d0.name} ${el.checked ? 'does' : 'no longer does'} list prep`); autoSchedule(); commit(); break; }
  }
});

document.addEventListener('submit', e => { if (e.target.id === 'taskForm') { e.preventDefault(); commitDraft(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $layer.innerHTML) { draft = null; $layer.innerHTML = ''; } });
setInterval(() => { if (ui.tab === 'timeline' && !draft) { const n = $main.querySelectorAll('.now'); const L = shiftLen(); const nr = nowRel(); if (nr >= L) n.forEach(x => x.hidden = true); else n.forEach(x => x.style.left = (nr / 60 * 84) + 'px'); } }, 60000);

R = migrate(load()) || example();
ui.shiftDate = currentShiftDate(); pointShift();
if (R.example) save();
// ?join=CODE link from the team chat
(() => { try { const q = new URLSearchParams(location.search).get('join'); if (!q) return; history.replaceState(null, '', location.pathname + location.hash);
  const c = normCode(q); if (!c || c === sync.code) return; if (!sync.code) { joinBoard(c); } else { sync.joinPrefill = c; ui.tab = 'team'; toast('You are on another team board. Leave it first to join this one.'); } } catch (e) {} })();
if (ui.meId && ui.meId !== 'observer' && !staffOf(ui.meId)) ui.meId = '';
if (!readPref('tab') && junior()) ui.tab = 'mine';
render(); renderSyncChip();
if (sync.code && !ui.meId && R.staff.length) showWho();
// roll over to the next shift when the current one ends, unless someone is looking at another date
setInterval(() => { const c = currentShiftDate(); if (ui.autoDate !== c) { const wasCurrent = ui.shiftDate === ui.autoDate; ui.autoDate = c; if (wasCurrent && !draft) { ui.shiftDate = c; pointShift(); safeRender(); } } }, 60000);
ui.autoDate = currentShiftDate();
if (sync.code) { setStatus('connecting'); sync.dirty ? push() : pull(true); }
setInterval(() => { if (sync.code && !document.hidden) { sync.dirty ? push() : pull(false); } }, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && sync.code) pull(false); });
document.addEventListener('focusout', () => setTimeout(() => { if (sync.needRender && !$main.contains(document.activeElement)) { sync.needRender = false; render(); } }, 0));
setInterval(renderSyncChip, 30000);
})();
