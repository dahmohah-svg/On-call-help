<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Plan OT cases, APS reviews, emergency calls, preop assessments and list prep across the on-call team.">
<meta name="theme-color" content="#1d6b58">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="On-Call">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>
<title>On-Call Board</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky shift bar + tabbed workspace (Board / Timeline / Tasks / Team). Task colours follow the ISO anaesthetic syringe-label convention. */
:root {
  --bg: #f3f5f4;
  --surface: #ffffff;
  --surface-2: #e8edeb;
  --fg: #16201d;
  --muted: #5b6a65;
  --line: #d3dbd8;
  --accent: #1d6b58;
  --accent-fg: #ffffff;
  --warn: #b25e00;
  --crit: #c62828;
  --ok: #2e7d32;
  /* syringe-label colours */
  --c-ot: #7b3fa3;       /* violet – vasopressors */
  --c-em: #e0262f;       /* fluorescent red – NMB */
  --c-aps: #1f6fc7;      /* blue – opioids */
  --c-pre: #d8a800;      /* yellow – induction agents */
  --c-list: #858b92;     /* grey – local anaesthetics */
  --c-obs: #d9654a;      /* salmon – antiemetics */
  --f-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r: 8px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1514; --surface: #172120; --surface-2: #1f2b29; --fg: #e4ece9; --muted: #93a49e; --line: #2c3a37;
    --accent: #4fc0a0; --accent-fg: #06201a; --warn: #f0a24a; --crit: #ff6b6b; --ok: #6cc070;
    --c-ot: #b98ae0; --c-em: #ff5a5f; --c-aps: #6fb0ff; --c-pre: #f2cd3c; --c-list: #a6acb3; --c-obs: #ff9b80;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1514; --surface: #172120; --surface-2: #1f2b29; --fg: #e4ece9; --muted: #93a49e; --line: #2c3a37;
  --accent: #4fc0a0; --accent-fg: #06201a; --warn: #f0a24a; --crit: #ff6b6b; --ok: #6cc070;
  --c-ot: #b98ae0; --c-em: #ff5a5f; --c-aps: #6fb0ff; --c-pre: #f2cd3c; --c-list: #a6acb3; --c-obs: #ff9b80;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); font-size: 15px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); max-width: 1280px; margin: 0 auto; }
.num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* header */
header.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding-block: 10px; }
.brand { font-family: var(--f-display); font-weight: 700; font-size: 22px; letter-spacing: .02em; text-transform: uppercase; display: flex; align-items: baseline; gap: 10px; }
.brand small { font-family: var(--f-mono); font-weight: 400; font-size: 12px; color: var(--muted); text-transform: none; letter-spacing: 0; }
.bar-stats { display: flex; gap: 6px; flex-wrap: wrap; margin-left: auto; }
.stat { font-size: 12px; padding: 3px 8px; border-radius: 99px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.stat b { color: var(--fg); font-family: var(--f-mono); }
.stat.alert { background: color-mix(in srgb, var(--crit) 15%, transparent); color: var(--crit); }
.stat.alert b { color: var(--crit); }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs button { border: 0; background: none; padding: 8px 14px 9px; font-family: var(--f-display); font-weight: 600; font-size: 16px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); border-bottom: 3px solid transparent; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent); }

main { padding-block: 16px 64px; display: grid; gap: 16px; }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 15px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.spacer { flex: 1; }

/* buttons */
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 7px 12px; font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--crit); }
.btn.sm { padding: 4px 9px; font-size: 13px; }
.btn .dot, .dot { width: 10px; height: 10px; border-radius: 2px; display: inline-block; flex: none; }

.t-ot { --c: var(--c-ot); } .t-em { --c: var(--c-em); } .t-aps { --c: var(--c-aps); } .t-pre { --c: var(--c-pre); } .t-list { --c: var(--c-list); } .t-obs { --c: var(--c-obs); }
.dot { background: var(--c); }

.banner { border: 1px dashed var(--line); border-radius: var(--r); padding: 10px 14px; font-size: 13px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }

/* board */
.queue { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; }
.queue.has { border-color: color-mix(in srgb, var(--crit) 50%, var(--line)); }
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.doc { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 12px; display: grid; gap: 10px; align-content: start; min-width: 0; }
.doc.off { opacity: .55; }
.doc-h { display: flex; gap: 8px; align-items: flex-start; }
.doc-name { font-weight: 700; font-size: 17px; line-height: 1.2; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.chip { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding: 2px 7px; border-radius: 4px; background: var(--surface-2); color: var(--muted); }
.chip.tier2 { background: color-mix(in srgb, var(--c-ot) 16%, transparent); color: var(--c-ot); }
.chip.tier1 { background: color-mix(in srgb, var(--c-aps) 16%, transparent); color: var(--c-aps); }
.chip.coord { background: var(--accent); color: var(--accent-fg); }
.chip.obs { background: color-mix(in srgb, var(--c-obs) 18%, transparent); color: var(--c-obs); }
.chip.lp { background: color-mix(in srgb, var(--c-list) 22%, transparent); color: var(--fg); }
select.status { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 3px 6px; font-size: 13px; margin-left: auto; }
.load { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: flex; }
.load span { display: block; height: 100%; background: var(--c); }
.load-l { font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
.empty { color: var(--muted); font-size: 13px; }

/* task item */
.tasks { display: grid; gap: 6px; }
.task { display: grid; grid-template-columns: 1fr auto; gap: 0 10px; background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--c); border-radius: 6px; overflow: hidden; padding-left: 10px; }
.task.help { border-color: var(--crit); border-left-color: var(--c); box-shadow: 0 0 0 2px var(--crit); }
.help-row { grid-column: 1 / -1; margin: 0 8px 8px 0; padding: 6px 8px; border-radius: 5px; background: color-mix(in srgb, var(--crit) 12%, transparent); color: var(--crit); font-weight: 700; font-size: 13px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.st-btns { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; padding: 0 8px 8px 0; }
.st-btns button { border: 1px solid var(--line); background: var(--surface-2); border-radius: 6px; padding: 9px 4px; font-weight: 700; font-size: 13px; }
.st-btns button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.st-btns button.b-help { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 50%, var(--line)); }
.st-btns button.b-help[aria-pressed="true"] { background: var(--crit); color: #fff; border-color: var(--crit); }
.st-sel { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; font-size: 12px; font-weight: 700; padding: 2px 6px; max-width: 130px; }
.st-sel.active { background: var(--c); color: #fff; border-color: var(--c); }
.st-sel.done { color: var(--ok); }
.st-sel.help { background: var(--crit); color: #fff; border-color: var(--crit); }
.who { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; font-size: 12.5px; padding: 1px 4px; max-width: 210px; }
.helpq { border: 2px solid var(--crit); border-radius: var(--r); background: color-mix(in srgb, var(--crit) 7%, var(--surface)); padding: 12px; display: grid; gap: 8px; }
.helpq h2 { color: var(--crit); }
.me-btn { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--surface); white-space: nowrap; }
.me-btn.unset { border-color: var(--accent); color: var(--accent); }
.who-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.who-list .btn { justify-content: center; }
.who-list .btn[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.post-l { display: flex; gap: 6px; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); }
.chip.tier3 { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
.chip.post-ot { background: color-mix(in srgb, var(--c-ot) 13%, transparent); color: var(--c-ot); }
.chip.post-out { background: color-mix(in srgb, var(--c-aps) 13%, transparent); color: var(--c-aps); }
details.done-list summary { cursor: pointer; font-weight: 700; color: var(--muted); font-size: 13px; padding: 4px 0; }
.task.done { opacity: .5; }
.task.done .t-title { text-decoration: line-through; }
.task.active { border-color: var(--c); box-shadow: 0 0 0 1px var(--c); }
.t-main { padding: 8px 0; min-width: 0; display: grid; gap: 2px; }
.t-top { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: baseline; font-size: 12px; color: var(--muted); }
.t-type { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--c); font-size: 13px; }
.t-title { font-weight: 700; overflow-wrap: anywhere; }
.t-meta { font-size: 12.5px; color: var(--muted); display: flex; flex-wrap: wrap; gap: 2px 10px; }
.t-side { padding: 8px 8px 8px 0; display: flex; flex-direction: column; gap: 4px; align-items: flex-end; }
.pri { font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 4px; white-space: nowrap; border: 1px solid currentColor; }
.pri.p1 { color: var(--crit); background: color-mix(in srgb, var(--crit) 12%, transparent); }
.pri.p2 { color: var(--warn); }
.pri.p3 { color: var(--muted); }
.pri.p4 { color: var(--muted); border-style: dashed; }
.st { border: 1px solid var(--line); background: var(--surface-2); border-radius: 99px; font-size: 12px; padding: 2px 9px; font-weight: 700; white-space: nowrap; }
.st.active { background: var(--c); color: #fff; border-color: var(--c); }
.st.done { color: var(--ok); }
.icon-btn { border: 0; background: none; color: var(--muted); font-size: 12px; padding: 2px 4px; text-decoration: underline; }
.late { color: var(--crit); font-weight: 700; }

/* timeline */
.tl-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow-x: auto; }
.tl { position: relative; min-width: max-content; }
.tl-row { display: flex; border-bottom: 1px solid var(--line); min-height: 52px; }
.tl-row:last-child { border-bottom: 0; }
.tl-lab { position: sticky; left: 0; z-index: 2; width: 132px; flex: none; background: var(--surface); border-right: 1px solid var(--line); padding: 6px 10px; font-size: 13px; display: flex; flex-direction: column; justify-content: center; }
.tl-lab b { font-size: 14px; }
.tl-lab span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.tl-track { position: relative; flex: none; background-image: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px var(--hw)); }
.tl-head .tl-track { background: none; }
.tl-head .tl-lab { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tl-hour { position: absolute; top: 0; bottom: 0; font-family: var(--f-mono); font-size: 11px; color: var(--muted); padding: 16px 0 0 4px; border-left: 1px solid var(--line); }
.blk { position: absolute; top: 6px; bottom: 6px; border-radius: 5px; background: color-mix(in srgb, var(--c) 22%, var(--surface)); border-left: 3px solid var(--c); padding: 3px 6px; font-size: 11.5px; line-height: 1.25; overflow: hidden; border-top: 0; border-right: 0; border-bottom: 0; text-align: left; }
.blk b { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk span { display: block; white-space: nowrap; overflow: hidden; color: var(--muted); font-family: var(--f-mono); font-size: 10.5px; }
.blk.done { opacity: .45; }
.now { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--crit); z-index: 1; pointer-events: none; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 12px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }

/* filters */
.seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
.seg button { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 4px 11px; font-size: 13px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }

/* team */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; }
label.f { display: grid; gap: 3px; font-size: 12px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; min-width: 0; }
.f input, .f select, .f textarea { font-size: 15px; font-weight: 400; text-transform: none; letter-spacing: 0; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; }
.f textarea { min-height: 60px; resize: vertical; }
.team-t { width: 100%; border-collapse: collapse; font-size: 14px; }
.team-t th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 6px; border-bottom: 1px solid var(--line); }
.team-t td { padding: 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.team-t input[type=text] { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 7px; width: 100%; min-width: 110px; }
.team-t select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px; }
.scroll-x { overflow-x: auto; }
.rules { font-size: 13.5px; color: var(--muted); margin: 0; padding-left: 18px; display: grid; gap: 4px; max-width: 70ch; }
.rules b { color: var(--fg); }

/* sheet */
.overlay { position: fixed; inset: 0; z-index: 20; background: rgb(0 0 0 / .45); display: flex; align-items: flex-end; justify-content: center; padding: env(safe-area-inset-top, 0px) 0 0; }
.sheet { background: var(--surface); width: 100%; max-width: 620px; max-height: 92vh; overflow: auto; border-radius: 14px 14px 0 0; padding: 16px max(16px, env(safe-area-inset-left, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
@media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 14px; } }
.sheet h3 { margin: 0; font-family: var(--f-display); font-size: 22px; text-transform: uppercase; letter-spacing: .04em; }
.typepick { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 6px; }
.typepick button { border: 1px solid var(--line); border-top: 4px solid var(--c); background: var(--bg); border-radius: 6px; padding: 8px 6px; font-weight: 700; font-size: 13px; }
.typepick button[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 18%, var(--surface)); border-color: var(--c); }
pre.handover { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 12px; font-family: var(--f-mono); font-size: 12.5px; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0; max-height: 50vh; overflow: auto; }
.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-weight: 700; font-size: 14px; z-index: 30; }
.sync-chip { font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 99px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; background: var(--surface-2); color: var(--muted); border: 0; }
.sync-chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sync-chip.live { color: var(--ok); background: color-mix(in srgb, var(--ok) 13%, transparent); }
.sync-chip.offline { color: var(--warn); background: color-mix(in srgb, var(--warn) 14%, transparent); }
.sync-chip.error { color: var(--crit); background: color-mix(in srgb, var(--crit) 13%, transparent); }
.code { font-family: var(--f-mono); font-size: 24px; font-weight: 500; letter-spacing: .08em; }
.share-box { display: grid; gap: 10px; padding: 12px; border-radius: 6px; background: var(--bg); border: 1px solid var(--line); }
.share-box input { font-family: var(--f-mono); font-size: 13px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; color: var(--crit); }
@media (prefers-reduced-motion: no-preference) { .btn, .seg button, nav.tabs button { transition: background .15s, border-color .15s, color .15s; } }
</style>

<header class="bar">
  <div class="wrap bar-in">
    <div class="brand">On-Call Board <small id="shiftLabel" class="num"></small></div>
    <button class="sync-chip" id="syncChip" data-act="goteam" hidden></button>
    <button class="me-btn" id="meBtn" data-act="whoami"></button>
    <div class="bar-stats" id="stats"></div>
  </div>
  <div class="wrap">
    <nav class="tabs" role="tablist" id="tabs">
      <button role="tab" data-tab="mine" id="tabMine">My work</button>
      <button role="tab" data-tab="board">Board</button>
      <button role="tab" data-tab="timeline">Schedule</button>
      <button role="tab" data-tab="tasks">Tasks</button>
      <button role="tab" data-tab="ot">OT list</button>
      <button role="tab" data-tab="team">Team &amp; shift</button>
    </nav>
  </div>
</header>

<main class="wrap" id="main"></main>
<div id="layer"></div>

<script>
(() => {
'use strict';

/* ---------- constants ---------- */
const TYPES = {
  ot:   { label: 'OT case',        short: 'OT',        cls: 't-ot',   dur: 90 },
  em:   { label: 'Emergency call', short: 'Emergency', cls: 't-em',   dur: 30 },
  aps:  { label: 'APS review',     short: 'APS',       cls: 't-aps',  dur: 20 },
  pre:  { label: 'Preop assessment', short: 'Preop',   cls: 't-pre',  dur: 25 },
  obs:  { label: 'Obs & Gyne',     short: 'Obs/Gyne',  cls: 't-obs',  dur: 45 },
  list: { label: 'List preparation', short: 'List prep', cls: 't-list', dur: 30 },
};
const PRI = {
  ot:   ['', 'Immediate', 'Urgent', 'Expedited', 'Elective'],   // NCEPOD
  em:   ['', 'Crash / now', 'Within 15 min', 'Within 1 h', 'When free'],
  aps:  ['', 'Urgent', 'Soon', 'Routine round', 'Routine'],
  pre:  ['', 'Urgent', 'Today', 'Before list', 'Elective'],
  obs:  ['', 'Cat 1 · now', 'Cat 2 · urgent', 'Cat 3 · soon', 'Cat 4 · elective'],
  list: ['', 'Urgent', 'Soon', 'Before handover', 'Routine'],
};
const DOC_STATUS = { available: 'Available', busy: 'Tied up', off: 'Off / away' };
const STORE_KEY = 'oncall-board-v1';

/* ---------- state ---------- */
let S = null;
S = load() || example();
let ui = { tab: readPref('tab') || 'board', filter: 'all', showDone: true, confirmReset: false, meId: readPref('meId') || '' };
const ST = { pending: 'To do', active: 'In progress', done: 'Done', help: 'Need help' };

function uid() { return Math.random().toString(36).slice(2, 9); }
function load() { try { const s = localStorage.getItem(STORE_KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function save() { try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {} }
function readPref(k) { try { return localStorage.getItem('oncall-pref-' + k); } catch (e) { return null; } }
function writePref(k, v) { try { localStorage.setItem('oncall-pref-' + k, v); } catch (e) {} }

function todayISO() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

    t('pre', 'Preop – hip fracture', 'Ortho ward, bed 3', 2, 30, '09:00', { asa: '3' }),

/* ---------- time helpers (minutes from shift start) ---------- */
function hm2abs(hm) { if (!hm || !/^\d{1,2}:\d{2}$/.test(hm)) return null; const [h, m] = hm.split(':').map(Number); return h * 60 + m; }
function startAbs() { return hm2abs(S.shift.start) ?? 480; }
function rel(hm) { const a = hm2abs(hm); if (a == null) return 0; let r = a - startAbs(); if (r < 0) r += 1440; return r; }
function fmt(relMin) { if (relMin == null) return '—'; const a = ((startAbs() + Math.round(relMin)) % 1440 + 1440) % 1440; return String(Math.floor(a / 60)).padStart(2, '0') + ':' + String(a % 60).padStart(2, '0'); }
function shiftLen() { return (S.shift.hours || 24) * 60; }
function nowRel() { const d = new Date(); let r = d.getHours() * 60 + d.getMinutes() - startAbs(); if (r < 0) r += 1440; return r; }

/* ---------- scheduling ---------- */
function doc(id) { return S.doctors.find(d => d.id === id); }
function busyOf(pred) { return S.tasks.filter(t => t.start != null && t.doctorId !== undefined && pred(t)).map(t => [t.start, t.start + t.duration]); }
function findSlot(lists, earliest, dur) {
  const iv = lists.flat().sort((a, b) => a[0] - b[0]);
  let t = earliest;
  for (const [s, e] of iv) { if (e <= t) continue; if (s >= t + dur) break; t = Math.max(t, e); }
  return t;
}
function inOT(d) { return d.tier === 'first' && !!d.post && d.post.where === 'ot'; }
function eligible(t) {
  const avail = S.doctors.filter(d => d.status !== 'off' && d.tier !== 'third');
  const by = tier => avail.filter(d => d.tier === tier);
  const gen = avail.filter(d => !d.obs);                   // obs & gyne on-call stays on labour ward
  const genBy = tier => gen.filter(d => d.tier === tier);
  let c;
  if (t.type === 'obs') c = avail.filter(d => d.obs || d.tier === 'second');
  else if (t.type === 'ot') c = genBy('second').concat(gen.filter(inOT));   // first on-calls posted inside OT can take cases
  else if (t.type === 'em') c = gen;
  else if (t.type === 'list') c = avail.filter(d => d.listPrep);
  else c = genBy('first');
  if (!c.length) c = t.type === 'list' ? genBy('first') : gen;
  if (!c.length) c = avail;
  return c;
}
function penalty(d, t) {
  let p = 0;
  if (d.status === 'busy') p += 30;
  if (inOT(d)) { if (t.type === 'ot') { p += (t.theatre && d.post.theatre && d.post.theatre !== t.theatre) ? 60 : -5; } else if (t.type !== 'list') p += 120; } // posted in OT: keep them there
  if (t.type === 'obs' && !d.obs) p += t.priority === 1 ? 15 : 90;   // second on-call covers obs only when needed
  if ((t.type === 'ot' || t.type === 'obs') && d.coordinator) p += 45;           // keep coordinator free to coordinate when possible
  if (t.type === 'em' && d.tier === 'second') p += t.priority === 1 ? 10 : 40; // first on-call attends calls first
  if (t.type !== 'list' && d.listPrep && t.priority >= 3) p += 10;
  return p;
}
function inTheatre(x) { return (x.type === 'ot' || x.type === 'obs') && !!x.theatre; }
function theatreCase(x) { return x.type === 'ot' || (x.type === 'obs' && !!x.theatre); }
function load_(d) { return S.tasks.filter(t => t.doctorId === d.id && t.status !== 'done').reduce((a, t) => a + t.duration, 0); }

function autoSchedule() {
  const L = shiftLen();
  for (const t of S.tasks) {
    if (t.status !== 'pending') continue;
    if (!t.fixDoctor) t.doctorId = null;
    if (!t.fixStart) t.start = null;
    if (t.type === 'ot' && t.theatreAuto) { t.theatre = ''; t.theatreAuto = false; }
  }
  const queue = S.tasks.filter(t => t.status === 'pending' && t.start == null)
    .sort((a, b) => a.priority - b.priority || rel(a.earliest) - rel(b.earliest) || a.seq - b.seq);
  for (const t of queue) {
    const cands = t.fixDoctor && doc(t.doctorId) ? [doc(t.doctorId)] : eligible(t);
    const theatres = t.type === 'ot' ? (t.theatre ? [t.theatre] : (S.shift.theatres.length ? S.shift.theatres : [''])) : (t.type === 'obs' && t.theatre ? [t.theatre] : [null]);
    const earliest = Math.min(rel(t.earliest), L - 1);
    let best = null;
    for (const d of cands) {
      const dBusy = busyOf(x => x.doctorId === d.id);
      const ths = t.type === 'ot' && !t.theatre && inOT(d) && d.post.theatre ? [d.post.theatre] : theatres;
      for (const th of ths) {
        const tBusy = th ? busyOf(x => inTheatre(x) && x.theatre === th) : [];
        const slot = findSlot([dBusy, tBusy], earliest, t.duration);
        const score = slot + penalty(d, t) + load_(d) / 1000;
        if (!best || score < best.score) best = { score, slot, d, th };
      }
    }
    if (best) {
      t.doctorId = best.d.id; t.start = best.slot;
      if (t.type === 'ot' && !t.theatre && best.th) { t.theatre = best.th; t.theatreAuto = true; }
    }
  }
}

/* ---------- derived ---------- */
function stats() {
  const open = S.tasks.filter(t => t.status !== 'done');
  return {
    open: open.length,
    unassigned: open.filter(t => !t.doctorId).length,
    active: S.tasks.filter(t => t.status === 'active').length,
    help: S.tasks.filter(t => t.status === 'help').length,
    p1: open.filter(t => t.priority === 1).length,
    late: open.filter(t => t.start != null && t.start + t.duration > shiftLen()).length,
  };
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function tierLabel(d) { return d.tier === 'third' ? '3rd on-call' : d.tier === 'second' ? '2nd on-call' : d.obs ? '1st on-call · Obs & Gyne' : '1st on-call'; }
function tierShort(d) { return d.tier === 'third' ? '3rd' : d.tier === 'second' ? '2nd' : '1st'; }
/* roles: who is using this phone */
function meDoc() { return ui.meId && ui.meId !== 'observer' ? doc(ui.meId) : null; }
function role() { const d = meDoc(); if (d) return d.tier; return ui.meId === 'observer' ? 'third' : 'none'; }
function canEdit() { return role() !== 'third'; }
function canAssign() { const r = role(); return r === 'second' || r === 'none'; }
function canEditTask(t) { return canEdit() && (role() !== 'first' || !t.doctorId || t.doctorId === ui.meId || t.postedBy === myName()); }
function canStatus(t) { return canEdit() && (role() !== 'first' || t.doctorId === ui.meId); }
function myName() { const d = meDoc(); return d ? d.name : (ui.meId === 'observer' ? 'Observer' : ''); }
function postLabel(d) { return inOT(d) ? 'In OT' + (d.post.theatre ? ' · ' + d.post.theatre : '') : 'Outside OT'; }
function postChip(d) { return d.tier === 'first' ? `<span class="chip ${inOT(d) ? 'post-ot' : 'post-out'}">${esc(postLabel(d))}</span>` : ''; }
function postSelect(d) {
  const v = inOT(d) ? 'ot:' + (d.post.theatre || '') : 'out';
  const opts = [['out', 'Outside OT – wards, ED, APS'], ['ot:', 'Inside OT – any theatre']].concat(S.shift.theatres.map(th => ['ot:' + th, 'Inside OT – ' + th]));
  return `<label class="post-l">Post<select class="who" data-act="post" data-id="${d.id}" aria-label="Post ${esc(d.name)}">${opts.map(([k, l]) => `<option value="${esc(k)}" ${k === v ? 'selected' : ''}>${esc(l)}</option>`).join('')}</select></label>`;
}
function assignOpts(t) {
  return `<option value="">${t.doctorId ? 'Auto (best fit)' : 'Unassigned – pick'}</option>` + S.doctors.filter(d => d.tier !== 'third').map(d =>
    `<option value="${d.id}" ${t.doctorId === d.id ? 'selected' : ''}>${esc(d.name)} · ${tierShort(d)}${d.obs ? ' obs' : ''}${inOT(d) ? ' (in OT)' : ''}${d.status === 'off' ? ' (off)' : ''}</option>`).join('');
}

/* ---------- render ---------- */
const $main = document.getElementById('main');
const $layer = document.getElementById('layer');

function render() {
  const sh = S.shift;
  const dt = new Date(sh.date + 'T00:00');
  const dateStr = isNaN(dt) ? sh.date : dt.toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' });
  document.getElementById('shiftLabel').textContent = `${dateStr} · ${sh.start}–${fmt(shiftLen())} (${sh.hours} h)`;
  const s = stats();
  document.getElementById('stats').innerHTML =
    `<span class="stat"><b>${s.open}</b> open</span>` +
    `<span class="stat"><b>${s.active}</b> in progress</span>` +
    `<span class="stat ${s.unassigned ? 'alert' : ''}"><b>${s.unassigned}</b> unassigned</span>` +
    (s.help ? `<span class="stat alert"><b>${s.help}</b> need help</span>` : '') +
    (s.p1 ? `<span class="stat alert"><b>${s.p1}</b> top priority</span>` : '') +
    (s.late ? `<span class="stat alert"><b>${s.late}</b> past shift end</span>` : '');
  document.querySelectorAll('#tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab)));
  const mb = document.getElementById('meBtn'); mb.textContent = meDoc() ? 'Me: ' + meDoc().name : ui.meId === 'observer' ? 'Observer' : 'Who are you?'; mb.classList.toggle('unset', !ui.meId);
  document.getElementById('tabMine').hidden = role() === 'third';
  if (ui.tab === 'mine' && role() === 'third') ui.tab = 'board';
  const views = { mine: viewMine, board: viewBoard, timeline: viewTimeline, tasks: viewTasks, ot: viewOT, team: viewTeam };
  $main.innerHTML = (views[ui.tab] || viewBoard)();
  if (ui.tab === 'timeline') { const w = $main.querySelector('.tl-wrap'); const n = $main.querySelector('.now'); if (w && n && !w.dataset.scrolled) { w.scrollLeft = Math.max(0, n.offsetLeft - 220); w.dataset.scrolled = 1; } }
}

function addButtons() {
  if (!canEdit()) return roBanner();
  return `<div class="row">` + Object.entries(TYPES).map(([k, v]) =>
    `<button class="btn sm ${v.cls}" data-act="new" data-type="${k}"><span class="dot"></span>${v.short}</button>`).join('') +
    `<span class="spacer"></span><button class="btn sm" data-act="handover">Handover text</button><button class="btn primary sm" data-act="schedule">Auto-schedule</button></div>`;
}

function roBanner() { return `<div class="banner"><span><b>Observer view.</b> You can see everything the team is doing, but not change it.</span><button class="btn sm" data-act="handover">Handover text</button></div>`; }
function helpQueue(exceptMe) {
  const hs = S.tasks.filter(t => t.status === 'help' && !(exceptMe && t.doctorId === ui.meId));
  if (!hs.length) return '';
  return `<section class="helpq"><h2>Need help · ${hs.length}</h2><div class="tasks">${hs.map(t => taskItem(t)).join('')}</div></section>`;
}
function exampleBanner() {
  if (!S.example) return '';
  return `<div class="banner"><span>Example shift loaded so you can see how it works. Edit the team under <b>Team &amp; shift</b>, or start blank.</span>
    <button class="btn sm" data-act="clear-example">Start a blank shift</button></div>`;
}

function taskItem(t, opts = {}) {
  const ty = TYPES[t.type]; const d = doc(t.doctorId);
  const end = t.start != null ? t.start + t.duration : null;
  const late = end != null && end > shiftLen();
  const time = t.start != null ? `<span class="num ${late ? 'late' : ''}">${fmt(t.start)}–${fmt(end)}</span>` : `<span class="num">not before ${esc(t.earliest || S.shift.start)}</span>`;
  const meta = [
    time,
    opts.hideDoc ? '' : (canAssign() && t.status !== 'done') ? `<select class="who" data-act="assign" data-id="${t.id}" aria-label="Assign doctor">${assignOpts(t)}</select>`
      : d ? `<span>${esc(d.name)}</span>` : `<span class="late">Unassigned</span>`,
    t.location ? `<span>${esc(t.location)}</span>` : '',
    t.theatre ? `<span>${esc(t.theatre)}</span>` : '',
    t.asa ? `<span>ASA ${esc(t.asa)}</span>` : '',
    `<span class="num">${t.duration} min</span>`,
    t.postedBy ? `<span>Posted by ${esc(t.postedBy)}</span>` : '',
  ].filter(Boolean).join('');
  const side = canStatus(t) && !opts.big
    ? `<select class="st-sel ${t.status}" data-act="setstatus" data-id="${t.id}" aria-label="Status">${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${t.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select>`
    : `<span class="st ${t.status}">${ST[t.status]}</span>`;
  const helpRow = t.status === 'help' ? `<div class="help-row"><span>${esc(d ? d.name : 'Someone')} needs help${t.helpAt ? ' · ' + ago(t.helpAt) : ''}${t.helpBy ? ` · <span style="color:var(--ok)">${esc(t.helpBy)} is going</span>` : ''}</span>${canEdit() && !t.helpBy && t.doctorId !== ui.meId ? `<button class="btn sm danger" data-act="ihelp" data-id="${t.id}">I'll go</button>` : ''}</div>` : '';
  const btns = opts.big && canStatus(t) ? `<div class="st-btns">${Object.entries(ST).map(([k, v]) => `<button class="${k === 'help' ? 'b-help' : ''}" aria-pressed="${t.status === k}" data-act="setst" data-v="${k}" data-id="${t.id}">${v}</button>`).join('')}</div>` : '';
  return `<div class="task ${ty.cls} ${t.status}">
    <div class="t-main"><div class="t-top"><span class="t-type">${ty.short}</span><span class="pri p${t.priority}">${esc(PRI[t.type][t.priority])}</span></div>
      <div class="t-title">${esc(t.title || ty.label)}</div><div class="t-meta">${meta}</div>
      ${t.notes ? `<div class="t-meta">${esc(t.notes)}</div>` : ''}</div>
    <div class="t-side">${side}
      ${canEditTask(t) ? `<button class="icon-btn" data-act="edit" data-id="${t.id}">Edit</button>` : ''}</div>${helpRow}${btns}</div>`;
}

function viewBoard() {
  const s = stats();
  const unassigned = S.tasks.filter(t => t.status !== 'done' && !t.doctorId);
  const coord = S.doctors.find(d => d.coordinator); const lp = S.doctors.filter(d => d.listPrep);
  const thirds = S.doctors.filter(d => d.tier === 'third');
  let h = exampleBanner() + addButtons() + helpQueue(false);
  h += `<div class="banner">${thirds.length ? `<span><b>3rd on-call:</b> ${thirds.map(d => esc(d.name) + (d.ext ? ` · ext <span class="num">${esc(d.ext)}</span>` : '')).join(', ')}</span>` : ''}<span><b>Coordinator:</b> ${coord ? esc(coord.name) + (coord.ext ? ` · ext <span class="num">${esc(coord.ext)}</span>` : '') : '<span class="late">not set</span>'}</span>
    <span><b>List prep:</b> ${lp.length ? lp.map(d => esc(d.name) + ` (${d.tier === 'second' ? '2nd' : '1st'})`).join(', ') : '<span class="late">not set</span>'}</span></div>`;
  if (unassigned.length) {
    h += `<section class="queue has"><div class="row"><h2>Waiting for a doctor · ${unassigned.length}</h2><span class="spacer"></span>${canEdit() ? '<button class="btn sm primary" data-act="schedule">Auto-assign</button>' : ''}</div>
      <div class="tasks">${unassigned.sort((a, b) => a.priority - b.priority).map(t => taskItem(t)).join('')}</div></section>`;
  }
  const groups = [['second', 'Second on-call · OT', d => d.tier === 'second'], ['first', 'First on-call · APS, emergencies, preop', d => d.tier === 'first' && !d.obs], ['obs', 'First on-call · Obs & Gyne', d => d.obs]];
  for (const [tier, title, fl] of groups) {
    const ds = S.doctors.filter(fl);
    h += `<section style="display:grid;gap:10px"><h2>${title}</h2>`;
    if (!ds.length) { h += `<p class="empty">No ${{ second: 'second on-call', first: 'first on-call', obs: 'Obs &amp; Gyne on-call' }[tier]} doctor added yet. Add one under Team &amp; shift.</p>`; }
    h += `<div class="docs">` + ds.map(docCard).join('') + `</div></section>`;
  }
  return h;
}

function docCard(d) {
  const mine = S.tasks.filter(t => t.doctorId === d.id).sort((a, b) => (a.status === 'done') - (b.status === 'done') || (a.start ?? 1e9) - (b.start ?? 1e9));
  const open = mine.filter(t => t.status !== 'done');
  const L = shiftLen();
  const byType = Object.keys(TYPES).map(k => [k, open.filter(t => t.type === k).reduce((a, t) => a + t.duration, 0)]).filter(x => x[1]);
  const total = byType.reduce((a, x) => a + x[1], 0);
  const bar = byType.map(([k, m]) => `<span class="${TYPES[k].cls}" style="width:${Math.min(100, m / L * 100 * 2.5)}%"></span>`).join('');
  const shown = open.slice(0, 4);
  return `<article class="doc ${d.status === 'off' ? 'off' : ''}">
    <div class="doc-h"><div style="min-width:0"><div class="doc-name">${esc(d.name)}</div>
      <div class="chips"><span class="chip ${d.tier === 'second' ? 'tier2' : 'tier1'}">${d.tier === 'second' ? '2nd on-call' : '1st on-call'}</span>${postChip(d)}${d.obs ? '<span class="chip obs">Obs &amp; Gyne</span>' : ''}${d.coordinator ? '<span class="chip coord">Coordinator</span>' : ''}${d.listPrep ? '<span class="chip lp">List prep</span>' : ''}${d.ext ? `<span class="chip num">ext ${esc(d.ext)}</span>` : ''}</div></div>
      <select class="status" data-act="docstatus" data-id="${d.id}" aria-label="Status of ${esc(d.name)}" ${canAssign() || d.id === ui.meId ? '' : 'disabled'}>${Object.entries(DOC_STATUS).map(([k, v]) => `<option value="${k}" ${d.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
    ${d.tier === 'first' && canAssign() ? postSelect(d) : ''}
    <div><div class="load">${bar}</div><div class="load-l"><span>${open.length} open task${open.length === 1 ? '' : 's'}</span><span class="num">${Math.floor(total / 60)} h ${total % 60} min booked</span></div></div>
    <div class="tasks">${shown.length ? shown.map(t => taskItem(t, { hideDoc: true })).join('') : '<p class="empty">Nothing assigned. Free for the next call.</p>'}
    ${open.length > shown.length ? `<p class="empty">+ ${open.length - shown.length} more in Schedule</p>` : ''}</div></article>`;
}

function viewTimeline() {
  const L = shiftLen(); const hw = 84; const W = L / 60 * hw;
  const px = m => m / 60 * hw;

function newCode() { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; let out = ''; crypto.getRandomValues(new Uint8Array(12)).forEach(b => out += a[b % 32]); return normCode(out); }
function shareLink() { return location.origin + location.pathname + '?join=' + encodeURIComponent(sync.code); }
async function rpc(fn, args) {

  if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch (e) {} const err = new Error(m || ('HTTP ' + r.status)); err.server = true; throw err; }
  return r.json();
}
function ago(ts) { if (!ts) return ''; const m = Math.round((Date.now() - new Date(ts)) / 60000); return m < 1 ? 'just now' : m < 60 ? m + ' min ago' : Math.round(m / 60) + ' h ago'; }
function setStatus(st, msg) { sync.status = st; sync.msg = msg || ''; renderSyncChip(); }

    : sync.status === 'offline' ? (sync.dirty ? 'Offline · changes will sync' : 'Offline · showing last saved') : sync.status === 'error' ? sync.msg : 'Connecting…';
}
function safeRender() {

}
function markDirty() {

}
// Record-level three-way merge: keep the other phones' changes, apply ours on top.
function mergeColl(base, mine, theirs) {
  const b = new Map((base || []).map(x => [x.id, x])), m = new Map((mine || []).map(x => [x.id, x]));
  const out = new Map((theirs || []).map(x => [x.id, x]));
  for (const [id, x] of m) if (!b.has(id) || !same(b.get(id), x)) out.set(id, x);
  for (const id of b.keys()) if (!m.has(id)) out.delete(id);
  return [...out.values()];
}
function merge(base, mine, theirs) {
  base = base || theirs;
  return { ...theirs, example: !!(mine.example && theirs.example), shift: same(base.shift, mine.shift) ? theirs.shift : mine.shift,
    doctors: mergeColl(base.doctors, mine.doctors, theirs.doctors), tasks: mergeColl(base.tasks, mine.tasks, theirs.tasks) };
}
function adopt(row) { sync.version = Number(row.version); sync.base = clone(row.state); sync.updatedBy = row.updated_by || ''; sync.updatedAt = row.updated_at || null; }
function mergeIn(row) {
  const merged = merge(sync.base, S, row.state);
  S = merged; autoSchedule(); adopt(row);

}
async function push() {
  if (!sync.code || sync.busy || !sync.dirty) return;
  sync.busy = true; const snap = clone(S); let again = false;
  try {
    const res = await rpc('oncall_save_board', { p_code: sync.code, p_state: snap, p_base: sync.version, p_by: myName() || null });
    if (res.ok) { sync.version = Number(res.version); sync.base = snap; sync.updatedBy = myName(); sync.updatedAt = res.updated_at; sync.dirty = !same(S, snap); setStatus('live'); again = sync.dirty; }
    else if (res.missing) { setStatus('error', 'Team board not found'); }
    else { mergeIn(res); setStatus('live'); again = sync.dirty; }
  } catch (e) { setStatus(e.server ? 'error' : 'offline', e.server ? 'Sync error' : ''); }
  sync.busy = false; persistSync();

}
async function pull(force) {
  if (!sync.code || sync.busy) return;

    let fetchIt = force;
    if (!fetchIt) { const v = await rpc('oncall_board_version', { p_code: sync.code }); if (v == null) { setStatus('error', 'Team board not found'); return; } fetchIt = Number(v) !== sync.version; }
    if (fetchIt) {
      const row = (await rpc('oncall_get_board', { p_code: sync.code }))[0];

      if (Number(row.version) >= sync.version) {
        if (sync.dirty) mergeIn(row); else { S = row.state; adopt(row); save(); safeRender(); }
      }

  finally { sync.busy = false; persistSync(); }
  if (sync.dirty) push();
}
async function createBoard() {
  const code = newCode();

    sync.code = code; writePref('board', code); sync.version = 1; sync.base = clone(S); sync.dirty = false; sync.updatedBy = myName(); sync.updatedAt = new Date().toISOString();

  } catch (e) { toast(e.server ? 'Could not create the board: ' + e.message : 'No connection to the team server. Try again with signal.'); }
}
async function joinBoard(raw) {

  try {

function leaveBoard() { sync.code = null; sync.dirty = false; sync.base = null; sync.version = 0; writePref('board', ''); persistSync(); setStatus('local'); render(); toast('Left the team board. A copy stays on this device.'); }
function copyText(txt, selectEl) {

  h += `<section class="panel"><div class="doc-h"><div style="min-width:0"><div class="doc-name">${esc(d.name)}</div>
    <div class="chips"><span class="chip ${d.tier === 'second' ? 'tier2' : 'tier1'}">${esc(tierLabel(d))}</span>${postChip(d)}${d.coordinator ? '<span class="chip coord">Coordinator</span>' : ''}${d.listPrep ? '<span class="chip lp">List prep</span>' : ''}</div></div>

  h += `<section style="display:grid;gap:8px"><h2>My open work · ${open.length}</h2><div class="tasks">${open.length ? open.map(t => taskItem(t, { big: true, hideDoc: true })).join('') : '<p class="empty">Nothing open. New work assigned to you appears here.</p>'}</div></section>`;

  }

function setTaskStatus(t, v) {
  if (!t || t.status === v) return;
  if (t.status === 'pending' && !t.doctorId) autoSchedule();
  const prev = t.status; t.status = v;
  if (v === 'active' && prev !== 'help') { const nr = nowRel(); if (nr < shiftLen() && (t.start == null || Math.abs(nr - t.start) > 5)) t.start = nr; }
  if (v === 'help') { t.helpAt = new Date().toISOString(); t.helpBy = ''; if (t.start == null) { const nr = nowRel(); t.start = nr < shiftLen() ? nr : 0; } }
  else { t.helpBy = ''; }
  if (v === 'done') t.doneBy = myName();
  if (v === 'pending') autoSchedule();
  commit();
  toast(v === 'help' ? 'Help requested – the whole team can see it' : v === 'done' ? 'Marked done' : 'Status: ' + ST[v]);
}

/* ---------- events ---------- */
let toastT;
function toast(msg) { clearTimeout(toastT); let el = document.querySelector('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); } el.textContent = msg; el.hidden = false; toastT = setTimeout(() => el.hidden = true, 2600); }
function commit() { save(); render(); markDirty(); }

document.getElementById('tabs').addEventListener('click', e => {
  const b = e.target.closest('button[data-tab]'); if (!b) return;
  ui.tab = b.dataset.tab; ui.confirmReset = false; writePref('tab', ui.tab); render(); window.scrollTo(0, 0);
});

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act; const id = el.dataset.id;
  if (a === 'close-bg' && e.target !== el) return;
  const t = id ? S.tasks.find(x => x.id === id) : null;
  const viewOnly = new Set(['close', 'close-bg', 'handover', 'otlist', 'copy', 'filter', 'goteam', 'copy-code', 'copy-link', 'whoami', 'setme', 'sync-join', 'sync-create', 'sync-leave']);
  if (!canEdit() && !viewOnly.has(a)) { toast('Observer view – read-only'); return; }
  if (a === 'edit' && t && !canEditTask(t)) { toast("Only the second on-call can change another doctor's task"); return; }
  switch (a) {
    case 'whoami': showWho(); break;
    case 'setme': {
      ui.meId = id; writePref('meId', id); $layer.innerHTML = '';
      const r = role(); ui.tab = r === 'first' ? 'mine' : r === 'third' ? 'board' : (ui.tab === 'team' ? 'board' : ui.tab); writePref('tab', ui.tab);
      render(); window.scrollTo(0, 0); toast(meDoc() ? 'You are ' + meDoc().name : 'Observer view – read-only'); break;
    }
    case 'setst': setTaskStatus(t, el.dataset.v); break;
    case 'ihelp': t.helpBy = myName() || 'Someone'; commit(); toast('The team can see you are going'); break;
    case 'new': newTask(el.dataset.type); break;
    case 'edit': ui.confirmDel = false; openTask(t); break;
    case 'close': case 'close-bg': draft = null; ui.confirmDel = false; $layer.innerHTML = ''; break;
    case 'ftype': readForm(); draft.type = el.dataset.type; draft.duration = draft._new ? TYPES[draft.type].dur : draft.duration; renderSheet(); break;
    case 'del': readForm(); ui.confirmDel = true; renderSheet(); break;
    case 'del-no': readForm(); ui.confirmDel = false; renderSheet(); break;
    case 'del-yes': S.tasks = S.tasks.filter(x => x.id !== draft.id); draft = null; ui.confirmDel = false; $layer.innerHTML = ''; autoSchedule(); commit(); toast('Task deleted'); break;
    case 'schedule': autoSchedule(); commit(); { const s = stats(); toast(s.unassigned ? `${s.unassigned} task(s) could not be placed` : 'Schedule updated'); } break;
    case 'handover': showText('Handover / team update', handoverText()); break;
    case 'otlist': showText('OT list', otListText()); break;
    case 'copy': {
      const pre = document.getElementById('htext'); const txt = pre.textContent;
      const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast('Text selected – copy it with your device'); };
      try { navigator.clipboard.writeText(txt).then(() => toast('Copied'), fallback); } catch (err) { fallback(); }
      break;
    }
    case 'filter': ui.filter = el.dataset.f; render(); break;
    case 'goteam': ui.tab = 'team'; writePref('tab', 'team'); render(); window.scrollTo(0, 0); break;
    case 'sync-create': createBoard(); break;
    case 'sync-join': joinBoard(document.getElementById('joinCode').value); break;
    case 'sync-leave': leaveBoard(); break;
    case 'copy-code': copyText(sync.code, null); break;
    case 'copy-link': copyText(shareLink(), document.getElementById('shareLink')); break;
    case 'up': case 'down': {
      const th = t.theatre || '';
      const cs = S.tasks.filter(x => theatreCase(x) && (x.theatre || '') === th).sort((p, q) => (p.start ?? 1e9) - (q.start ?? 1e9) || p.seq - q.seq);
      const i = cs.indexOf(t); const j = a === 'up' ? i - 1 : i + 1; if (j < 0 || j >= cs.length) break;
      const o = cs[j];
      // swap order; equalise priority so the swap holds under NCEPOD ordering only when categories match
      [t.seq, o.seq] = [o.seq, t.seq];
      if (t.seq === o.seq) { a === 'up' ? t.seq-- : t.seq++; }
      if (t.priority !== o.priority) toast('Different category – higher priority still goes first');
      for (const x of [t, o]) if (x.status === 'pending' && !x.fixStart) { x.start = null; }
      // keep both in this theatre while reordering
      for (const x of [t, o]) if (x.theatreAuto) x.theatreAuto = false;
      autoSchedule(); commit(); break;
    }
    case 'clear-example': S.example = false; S.tasks = []; ui.meId = ''; writePref('meId', ''); S.doctors = [
      { id: uid(), name: 'Third on-call', tier: 'third', coordinator: false, listPrep: false, ext: '', status: 'available' },
      { id: uid(), name: 'Second on-call 1', tier: 'second', coordinator: true, listPrep: false, ext: '', status: 'available' },
      { id: uid(), name: 'Second on-call 2', tier: 'second', coordinator: false, listPrep: false, ext: '', status: 'available' },
      { id: uid(), name: 'First on-call 1', tier: 'first', coordinator: false, listPrep: true, ext: '', status: 'available' },
      { id: uid(), name: 'First on-call 2', tier: 'first', coordinator: false, listPrep: false, ext: '', status: 'available' },
      { id: uid(), name: 'First on-call 3', tier: 'first', coordinator: false, listPrep: false, ext: '', status: 'available' },
      { id: uid(), name: 'Obs & Gyne on-call', tier: 'first', obs: true, coordinator: false, listPrep: false, ext: '', status: 'available' }];
      S.shift.date = todayISO(); ui.tab = 'team'; writePref('tab', 'team'); commit(); toast('Blank shift – add your team names'); break;
    case 'dadd': { const k = el.dataset.tier; S.doctors.push({ id: uid(), name: { third: 'New 3rd on-call', second: 'New 2nd on-call', first: 'New 1st on-call', obs: 'New Obs & Gyne on-call' }[k], tier: k === 'obs' ? 'first' : k, obs: k === 'obs', coordinator: false, listPrep: false, ext: '', status: 'available' }); commit(); break; }
    case 'ddel': S.doctors = S.doctors.filter(d => d.id !== id); S.tasks.forEach(x => { if (x.doctorId === id) { x.doctorId = null; x.fixDoctor = false; x.fixStart = false; if (x.status === 'pending') x.start = null; } }); autoSchedule(); commit(); break;
    case 'newshift': S.tasks = []; S.example = false; S.shift.date = todayISO(); S.doctors.forEach(d => d.status = 'available'); commit(); toast('New shift started'); break;
    case 'reset': ui.confirmReset = true; render(); break;
    case 'reset-no': ui.confirmReset = false; render(); break;
    case 'reset-yes': S = { example: false, shift: { date: todayISO(), start: '08:00', hours: 24, theatres: ['Main OT 1', 'Main OT 2', 'Emergency OT', 'Obstetric OT'] }, doctors: [], tasks: [] }; ui.confirmReset = false; commit(); toast('All data deleted'); break;
  }
});

document.addEventListener('change', e => {
  const el = e.target; const a = el.dataset.act; if (!a) return;
  const d = el.dataset.id ? doc(el.dataset.id) : null;
  if (!canEdit() && a !== 'showdone') { render(); toast('Observer view – read-only'); return; }
  switch (a) {
    case 'setstatus': setTaskStatus(S.tasks.find(x => x.id === el.dataset.id), el.value); break;
    case 'assign': {
      const t = S.tasks.find(x => x.id === el.dataset.id); if (!t) break;
      if (el.value) { t.doctorId = el.value; t.fixDoctor = true; } else { t.fixDoctor = false; t.fixStart = false; }
      if (t.status === 'pending' && !t.fixStart) t.start = null;
      autoSchedule(); commit(); const nd = doc(t.doctorId);
      toast(nd ? `${t.title || TYPES[t.type].short} → ${nd.name}${t.start != null ? ' at ' + fmt(t.start) : ''}` : 'Back to auto-assign'); break;
    }
    case 'post': {
      d.post = el.value === 'out' ? { where: 'out', theatre: '' } : { where: 'ot', theatre: el.value.slice(3) };
      autoSchedule(); commit(); toast(`${d.name}: ${postLabel(d)}`); break;
    }
    case 'docstatus': d.status = el.value; autoSchedule(); commit(); toast(`${d.name}: ${DOC_STATUS[d.status]} – schedule updated`); break;
    case 'showdone': ui.showDone = el.checked; render(); break;
    case 'dname': d.name = el.value.trim() || d.name; S.example = false; commit(); break;
    case 'dext': d.ext = el.value.trim(); commit(); break;
    case 'dtier': d.tier = el.value; if (d.tier !== 'second') d.coordinator = false; if (d.tier !== 'first') { d.obs = false; d.post = undefined; } if (d.tier === 'third') { d.listPrep = false; S.tasks.forEach(x => { if (x.doctorId === d.id && x.status === 'pending') { x.doctorId = null; x.fixDoctor = false; x.fixStart = false; x.start = null; } }); } autoSchedule(); commit(); break;
    case 'dcoord': S.doctors.forEach(x => x.coordinator = x.id === d.id); autoSchedule(); commit(); break;
    case 'dlist': d.listPrep = el.checked; autoSchedule(); commit(); break;
    case 'dobs': d.obs = el.checked; if (d.obs) { d.tier = 'first'; d.coordinator = false; } autoSchedule(); commit(); break;
    case 'shdate': S.shift.date = el.value || todayISO(); commit(); break;
    case 'shstart': {
      const old = startAbs(); S.shift.start = el.value || '08:00'; const diff = startAbs() - old;
      // keep fixed/active blocks at the same clock time
      S.tasks.forEach(t => { if (t.start != null) { t.start -= diff; if (t.start < 0) t.start += 1440; } });
      autoSchedule(); commit(); break;
    }
    case 'shhours': S.shift.hours = Number(el.value) || 24; autoSchedule(); commit(); break;
    case 'shth': S.shift.theatres = el.value.split(',').map(x => x.trim()).filter(Boolean); autoSchedule(); commit(); break;
  }
});

document.addEventListener('submit', e => { if (e.target.id === 'taskForm') { e.preventDefault(); commitDraft(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $layer.innerHTML) { draft = null; $layer.innerHTML = ''; } });
setInterval(() => { if (ui.tab === 'timeline' && !draft) { const n = $main.querySelectorAll('.now'); const L = shiftLen(); const nr = nowRel(); n.forEach(x => x.style.left = (nr / 60 * 84) + 'px'); if (nr >= L) n.forEach(x => x.hidden = true); } }, 60000);

if (S.example) save();
// ?join=CODE link from the team chat
(() => { try { const q = new URLSearchParams(location.search).get('join'); if (!q) return; history.replaceState(null, '', location.pathname + location.hash);
  const c = normCode(q); if (!c || c === sync.code) return; if (!sync.code) { joinBoard(c); } else { sync.joinPrefill = c; ui.tab = 'team'; toast('You are on another team board. Leave it first to join this one.'); } } catch (e) {} })();
if (ui.meId && ui.meId !== 'observer' && !doc(ui.meId)) ui.meId = '';
if (!readPref('tab') && role() === 'first') ui.tab = 'mine';
render(); renderSyncChip();
if (sync.code && !ui.meId && S.doctors.length) showWho();
if (sync.code) { setStatus('connecting'); sync.dirty ? push() : pull(true); }
setInterval(() => { if (sync.code && !document.hidden) { sync.dirty ? push() : pull(false); } }, 4000);
document.addEventListener('visibilitychange', () => { if (!document.hidden && sync.code) pull(false); });
document.addEventListener('focusout', () => setTimeout(() => { if (sync.needRender && !$main.contains(document.activeElement)) { sync.needRender = false; render(); } }, 0));
setInterval(renderSyncChip, 30000);
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
}
</script>
